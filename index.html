<title>Le Garage des Petites Voitures</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playwrite+FR+Moderne:wght@400&display=swap">
<style>
/* Layout: one screen, sky on top, road strip at the bottom; huge touch targets for small fingers.
   Single deliberate daytime look (a toy road mat), used in both host themes. */
:root{
  --sky:#bfe6ff; --sky2:#e9f7ff; --grass:#7cc96a; --road:#4b4f5c; --line:#ffe066;
  --ink:#1f2a44; --card:#ffffff; --accent:#ff7a2f; --good:#2fb36b; --soft:#5a6a8a;
  --display:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:linear-gradient(var(--sky) 0%,var(--sky2) 62%,var(--grass) 62%,var(--grass) 100%);background-color:var(--sky);color:var(--ink);font-family:var(--body);overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;box-sizing:border-box;max-width:900px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{font:800 1rem var(--body);background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:10px 16px;min-height:52px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.stars{font:800 1.5rem var(--display);background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:4px 18px;display:flex;align-items:center;gap:6px}
.stars svg{width:28px;height:28px}
h1{font:800 clamp(2rem,7vw,3.4rem)/1 var(--display);text-align:center;margin:18px 0 6px;text-wrap:balance;color:var(--ink)}
.sub{text-align:center;font-size:1.15rem;margin:0 0 18px;color:var(--soft)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:8px}
.mode{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 7px 0 var(--ink);font:800 1.7rem var(--display);color:var(--ink)}
.mode:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.mode small{font:600 1rem var(--body);color:var(--soft)}
.mode .pic{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.mode .pic svg{width:70px}
.prompt{font:800 clamp(1.5rem,5.5vw,2.4rem)/1.1 var(--display);text-align:center;margin:14px 0 4px;min-height:2.2em;text-wrap:balance;display:flex;align-items:center;justify-content:center;gap:10px}
.swatch{display:inline-block;width:1em;height:1em;border-radius:50%;border:3px solid var(--ink);vertical-align:middle}
.again{font:800 1rem var(--body);border:3px solid var(--ink);background:var(--card);border-radius:999px;min-width:48px;min-height:48px;cursor:pointer}
.stage{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding-bottom:16px}
/* colour game */
.garages{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,3vw,22px)}
.garage{border:none;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.garage .roof{width:100%;height:0;padding-bottom:22%;background:var(--ink);clip-path:polygon(50% 0,100% 100%,0 100%)}
.garage .box{width:88%;aspect-ratio:1/0.85;max-width:100%;background:#f3ecdf;border:4px solid var(--ink);border-top:none;border-radius:0 0 10px 10px;display:flex;align-items:flex-end;justify-content:center;padding:10px 10px 0;box-sizing:border-box;position:relative}
.garage .door{width:100%;height:78%;border:4px solid var(--ink);border-bottom:none;border-radius:10px 10px 0 0;background:repeating-linear-gradient(var(--c) 0 16px,rgba(0,0,0,.18) 16px 19px);position:relative;overflow:hidden}
.garage .parked{position:absolute;left:8%;right:8%;bottom:4px}
.garage:focus-visible{outline:5px dashed var(--accent);outline-offset:6px;border-radius:12px}
.garage.wrong{animation:shake .45s}
.garage.right .door{animation:open .6s forwards}
.road{background:var(--road);border-radius:18px;padding:18px 10px;position:relative;min-height:110px;display:flex;align-items:center;justify-content:center;border:4px solid var(--ink)}
.road::after{content:"";position:absolute;left:12px;right:12px;top:50%;border-top:6px dashed var(--line);transform:translateY(-50%);z-index:0}
.hero-car{width:min(46vw,230px);position:relative;z-index:1;animation:drive .9s cubic-bezier(.2,.8,.3,1)}
.hero-car.go{animation:leave .5s forwards}
/* counting game */
.lot{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;position:relative;z-index:1}
.lot button{border:none;background:none;padding:2px;cursor:pointer;width:clamp(64px,17vw,104px);position:relative;border-radius:12px}
.lot button:focus-visible{outline:4px dashed var(--line)}
.lot button .num{position:absolute;top:-14px;right:-6px;background:var(--line);color:var(--ink);font:800 1.3rem var(--display);width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);display:none;align-items:center;justify-content:center}
.lot button.on .num{display:flex}
.lot button.on svg{filter:drop-shadow(0 0 6px var(--line))}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3vw,20px)}
.ans{background:var(--card);border:4px solid var(--ink);border-radius:24px;cursor:pointer;padding:10px 6px 12px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.ans b{font:800 clamp(2.6rem,11vw,4rem)/1 var(--display);font-variant-numeric:tabular-nums}
.ans .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:90px}
.ans .dots i{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.ans.wrong{animation:shake .45s}
.ans.right{background:var(--good);color:#fff}
.ans:focus-visible,.mode:focus-visible,.iconbtn:focus-visible,.again:focus-visible{outline:5px dashed var(--accent);outline-offset:4px}
/* shapes game */
.hero-car.shape-scene{width:min(78vw,380px)}
.shape-ans{padding:14px}
.shape-ans svg{width:clamp(56px,16vw,88px)!important}
.shape-ans.right svg *{stroke:#fff}
.hole{animation:blink 1.1s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.45}to{opacity:1}}
.mode .pic svg{max-height:70px}
/* size game */
.app{--u:110px}
.mode .pic.sizes{align-items:flex-end}
.mode .pic.sizes svg{width:100%}
.pile{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:12px;min-height:90px}
.szcar{border:none;background:none;padding:0;cursor:pointer;width:calc(var(--u) * var(--s));max-width:100%}
.szcar.gone{visibility:hidden}
.szcar.wrong{animation:shake .45s}
.szcar:focus-visible{outline:4px dashed var(--accent);outline-offset:4px;border-radius:10px}
.slots{display:flex;justify-content:center;align-items:flex-end;gap:10px;position:relative;z-index:1}
.slot{width:calc(var(--u) * var(--s))}
.ghost{opacity:.6}
.ghost svg *{fill:none!important;stroke:#ffffff!important;stroke-dasharray:4 3}
/* sounds game */
.listen-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.listen{width:clamp(130px,36vw,170px);aspect-ratio:1;border-radius:50%;background:var(--accent);border:5px solid var(--ink);box-shadow:0 7px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font:800 1.4rem var(--display)}
.listen svg{width:56%}
.listen:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.listen.playing{animation:pulse .5s ease-in-out infinite alternate}
.listen:focus-visible{outline:5px dashed var(--ink);outline-offset:5px}
.mute-note{margin:0;font-weight:800;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:6px 12px}
.veh svg{width:100%;max-width:120px}
.veh span{font:800 1.1rem var(--display)}
@keyframes pulse{to{transform:scale(1.08)}}
/* name game */
.plate{display:inline-flex;align-items:center;justify-content:center;background:#ffffff;color:#1f2a44;border:4px solid #1f2a44;border-radius:10px;font:800 clamp(2.2rem,9vw,3.4rem)/1 var(--display);min-width:1.4em;padding:4px 8px 0;box-shadow:inset 0 0 0 3px #ffe066}
.plate.mini{font-size:2rem;min-width:1.3em}
.plate.inline{font-size:1em;border-width:3px;padding:0 8px;vertical-align:middle}
.platecar{gap:8px;padding:12px 8px 14px}
.platecar svg{width:100%;max-width:110px}
.platecar.right .plate{background:#ffffff}
.namerow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.nslot{width:clamp(44px,12vw,64px);aspect-ratio:1/1.1;display:flex;align-items:center;justify-content:center;border:4px dashed var(--ink);border-radius:12px;font:800 clamp(1.8rem,7vw,2.8rem)/1 var(--display);color:transparent;background:rgba(255,255,255,.5)}
.nslot.cur{border-style:solid;border-color:var(--accent);background:var(--card);animation:pulse .6s ease-in-out infinite alternate}
.nslot.full{border-style:solid;color:var(--ink);background:var(--card)}
.nslot.win{background:var(--line);animation:hop .5s ease-in-out 3 alternate}
.namecfg{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.example{font-size:.95rem;font-weight:800;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:4px 10px;text-align:center}
.nameform{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;font-size:.95rem;color:var(--ink)}
.nameform input{font:800 1.1rem var(--body);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;width:9em;max-width:100%;background:var(--card);color:var(--ink)}
.nameform input:focus-visible{outline:4px dashed var(--accent)}
.nameform .iconbtn{min-height:44px;padding:6px 16px}
/* traffic light game */
.feu-wrap{display:flex;justify-content:center}
.feu{display:inline-flex;flex-direction:column;gap:8px;background:#1f2a44;border:4px solid #1f2a44;border-radius:22px;padding:10px}
.feu i{width:clamp(44px,12vw,62px);aspect-ratio:1;border-radius:50%;background:#3a4258;transition:background .2s,box-shadow .2s}
.feu i.r.on{background:#ff3b3b;box-shadow:0 0 22px #ff3b3b}
.feu i.o.on{background:#ffa31a;box-shadow:0 0 22px #ffa31a}
.feu i.v.on{background:#2fe07a;box-shadow:0 0 22px #2fe07a}
.feu.mini{padding:5px;gap:4px;border-radius:12px}
.feu.mini i{width:16px}
.lroad{padding:14px}
.track{position:relative;width:100%;height:clamp(70px,18vw,110px);--carw:clamp(90px,24vw,150px);--garw:clamp(70px,18vw,110px)}
.lcar{position:absolute;bottom:0;width:var(--carw);transition:left .25s ease-out;z-index:2}
.lcar.wrong{animation:shake .45s}
.lgarage{position:absolute;right:0;bottom:0;width:var(--garw);display:flex;flex-direction:column;align-items:center;z-index:1}
.lgarage .roof{width:100%;height:0;padding-bottom:28%;background:var(--accent);clip-path:polygon(50% 0,100% 100%,0 100%)}
.lgarage .box{width:86%;background:#f3ecdf;border:3px solid var(--ink);border-top:none;color:var(--ink);font:800 clamp(.7rem,2.6vw,1rem) var(--display);text-align:center;padding:12px 0 18px}
.go-btn{align-self:center;font:800 clamp(1.8rem,7vw,2.6rem) var(--display);color:#fff;background:#2fb36b;border:5px solid var(--ink);border-radius:999px;padding:14px 44px;box-shadow:0 7px 0 var(--ink);cursor:pointer;transition:background .2s}
.go-btn[data-s="red"]{background:#e63946}
.go-btn[data-s="orange"]{background:#ff9f1c}
.go-btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.go-btn:focus-visible{outline:5px dashed var(--accent);outline-offset:5px}
[hidden]{display:none!important}
.mode{position:relative}
.mstars{position:absolute;top:10px;right:12px;display:flex;align-items:center;gap:3px;font:800 1.1rem var(--display);background:var(--sky2);border:2px solid var(--ink);border-radius:999px;padding:1px 10px 0 6px;font-variant-numeric:tabular-nums}
.mstars svg{width:20px;height:20px}
.stars .tot{font:800 .8rem var(--body);color:var(--soft)}
.whochip{display:flex;align-items:center;gap:6px;max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whocar{width:34px;flex:none}
.addp{background:var(--card);border:4px solid var(--ink);border-radius:24px;padding:16px;margin-top:18px;display:flex;flex-direction:column;gap:10px;align-items:center}
.addp label{font:800 1.3rem var(--display)}
.addrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.addrow input{font:800 1.1rem var(--body);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;width:11em;max-width:100%;background:var(--card);color:var(--ink);user-select:text;-webkit-user-select:text}
.colors{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.cdot{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);cursor:pointer}
.cdot[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:3px}
.cdot:focus-visible{outline:4px dashed var(--accent);outline-offset:3px}
.inl{width:18px;height:18px;vertical-align:-3px}
.glab{font-weight:800;align-self:center}
.gsel{font:800 1.05rem var(--body);border:3px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--card);color:var(--ink)}
.gsel:focus-visible{outline:4px dashed var(--accent)}
.gradeline{justify-content:flex-start}
/* counting by tens + problems */
.lot.tens{gap:8px}
.road:has(.tens)::after,.road:has(.minus)::after{display:none}
.lot .row10{width:100%;display:flex;gap:2px;padding:4px;border:3px dashed rgba(255,255,255,.35);border-radius:12px}
.lot .row10 svg{width:10%!important;flex:1}
.lot .row10 .num{top:-12px;right:-4px}
.lot.tens > button:not(.row10){width:clamp(40px,11vw,64px)}
.eq{text-align:center;font:800 clamp(2rem,9vw,3rem)/1 var(--display);margin:0;font-variant-numeric:tabular-nums}
.pscene{display:flex;align-items:flex-end;justify-content:center;gap:14px;flex-wrap:nowrap;position:relative;z-index:1}
.pgarage{display:flex;flex-direction:column;align-items:center;width:clamp(110px,30vw,150px)}
.pgarage .roof{width:100%;height:0;padding-bottom:26%;background:var(--accent);clip-path:polygon(50% 0,100% 100%,0 100%)}
.pgarage .box{width:88%;background:#f3ecdf;border:4px solid var(--ink);border-top:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:6px 0 8px}
.pgarage b{font:800 clamp(2.4rem,10vw,3.4rem)/1 var(--display)}
.pgarage small{font-weight:800;font-size:.8rem}
.arrive{display:flex;flex-wrap:wrap;gap:6px;max-width:60%;justify-content:center}
.acar{width:clamp(56px,15vw,84px);animation:drive .9s cubic-bezier(.2,.8,.3,1)}
.minus .acar{animation:none}
.minus.small .acar{width:clamp(40px,10vw,58px)}
.minus .acar.leave{opacity:.55;animation:goaway 1.2s .9s forwards}
@keyframes goaway{to{transform:translateX(30px);opacity:.3}}
/* train game */
.trainroad{padding:22px 8px;overflow:hidden}
.trainroad::after{display:none}
.trainroad .train{gap:2px}
.train{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 6px;width:100%;position:relative;z-index:1}
.train.go{animation:trainoff 1.2s ease-in forwards}
@keyframes trainoff{to{transform:translateX(110%)}}
.tcar{flex:0 0 calc(25% - 5px);min-width:0;position:relative;display:flex;align-items:flex-end;justify-content:center}
.tcar svg{width:100%}
.tcar.small svg{width:62%!important}
.tnum{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:#fff;color:#1f2a44;border:2px solid #1f2a44;border-radius:6px;font:800 clamp(.8rem,3.4vw,1.2rem)/1 var(--display);padding:3px 5px 1px;font-variant-numeric:tabular-nums}
.tslot{flex:0 0 calc(25% - 5px);min-width:0;aspect-ratio:120/64;border:3px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--line);font:800 1.6rem var(--display);animation:blink 1.1s ease-in-out infinite alternate}
.tchoice{padding:16px 10px}
.tchoice .tcar{width:100%;flex-basis:auto}
.tchoice .tnum{font-size:clamp(1.1rem,5vw,1.6rem)}
.minitrain{display:flex;align-items:flex-end;gap:3px}
.mq{width:30px;height:24px;border:2px dashed var(--ink);border-radius:6px;font:800 1rem var(--display);display:flex;align-items:center;justify-content:center}
/* gps game */
.posbox{background:var(--card);border:4px solid var(--ink);border-radius:20px;overflow:hidden}
.posscene{display:block;width:100%;height:auto}
.spot{fill:rgba(255,255,255,.25);stroke:#ff7a2f;stroke-width:3;stroke-dasharray:7 5;cursor:pointer}
.spot:hover{fill:rgba(255,122,47,.18)}
.spot.ok{stroke:#2fb36b;stroke-dasharray:none}
.spot.no{animation:spotno .45s}
@keyframes spotno{50%{fill:rgba(230,57,70,.35)}}
.gpsstage{justify-content:flex-start;gap:12px}
.town{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:5px;background:#4b4f5c;border:4px solid var(--ink);border-radius:18px;padding:6px;width:min(100%,420px);margin:0 auto;box-sizing:border-box}
.cell{aspect-ratio:1;background:#bfe8a8;border:none;border-radius:10px;padding:8%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cell svg{width:100%;height:100%;transition:transform .2s}
.cell.tree{background:#9fd68a;cursor:default}
.cell.goal{background:var(--line)}
.cell.no{animation:shake .45s;background:#ffc9c9}
.cell:focus-visible{outline:4px dashed var(--accent)}
.prog{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:48px;align-items:center;background:var(--card);border:3px dashed var(--ink);border-radius:14px;padding:6px}
.progempty{color:var(--soft);font-weight:800}
.pstep{font-size:1.6rem;line-height:1}
.pstep.cur{transform:scale(1.35);filter:drop-shadow(0 0 4px var(--accent))}
.arrows{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.arrow{background:var(--card);border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.arrow span{font-size:2rem;line-height:1.1}
.arrow small{font-weight:800;font-size:.85rem}
.arrow:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.arrow:focus-visible{outline:4px dashed var(--accent);outline-offset:3px}
.gpsact{justify-content:center}
.minigps{display:flex;align-items:center;gap:6px}
.minigps svg{width:48px}
.minigps b{font-size:1.6rem}
/* level variants */
.rot{display:block;width:clamp(56px,16vw,88px);margin:0 auto}
.rot svg{width:100%!important}
.answers.two{grid-template-columns:repeat(2,1fr)}
.answers:has(> :nth-child(4):last-child){grid-template-columns:repeat(2,1fr);max-width:520px;margin-inline:auto;width:100%}
.gen{gap:6px;padding:12px 8px 14px}
.gen > svg{width:100%;max-width:120px}
.clab{font:800 1.05rem var(--display)}
.clab.big2{font-size:clamp(1.3rem,5.5vw,1.8rem)}
.solid{display:block;width:clamp(56px,16vw,84px)}
.objscene{display:flex;align-items:flex-end;justify-content:center;gap:18px;padding:16px}
.objscene::after{display:none}
.obj{width:clamp(90px,26vw,130px);position:relative;z-index:1;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:8px}
.objcar{width:clamp(90px,26vw,130px);position:relative;z-index:1}
.measure{flex-direction:column;align-items:flex-start;gap:4px;padding:16px}
.measure::after{display:none}
.mrow{display:flex;align-items:flex-end}
.mrow.units span{flex:1;border-left:2px dashed rgba(255,255,255,.5)}
.mrow.units span:first-child{border-left:none}
.rulerbox{padding:16px 10px 10px}
.rtruck{display:block}
.ruler{display:block;width:100%;height:auto}
.plate.cursive{font-family:"Playwrite FR Moderne","Segoe Script","Brush Script MT",cursive;font-weight:400;font-size:clamp(1.8rem,7vw,2.6rem);padding-top:10px}
.syllword{display:flex;flex-direction:column;align-items:center;gap:6px}
.spic{width:min(40vw,170px)}
.sword{font:800 clamp(2rem,9vw,3rem)/1 var(--display);background:var(--card);border:4px solid var(--ink);border-radius:16px;padding:6px 18px 2px}
.sdots{display:flex;justify-content:center;gap:10px;min-height:34px}
.sdots i{width:30px;height:30px;border-radius:50%;background:var(--accent);border:3px solid var(--ink)}
.gph{display:inline-block;background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:0 10px;font-size:1.1em}
/* collection, daily route, settings */
.top .iconbtn{white-space:nowrap;padding-inline:12px}
.top .stars{padding:4px 12px}
html{background:var(--grass)}
.daybar{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:4px 0 18px}
.daybtn{display:flex;align-items:center;gap:14px;background:var(--accent);color:#fff;border:4px solid var(--ink);border-radius:24px;padding:10px 22px 10px 14px;box-shadow:0 6px 0 var(--ink);cursor:pointer;text-align:left}
.daybtn b{display:block;font:800 1.6rem/1 var(--display)}
.daybtn small{font-weight:800;font-size:.9rem}
.daybtn .dcar{width:74px;flex:none}
.daybtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.daybtn:focus-visible{outline:5px dashed var(--ink);outline-offset:4px}
.garbtn{align-self:center}
.closedbanner{text-align:center;font-weight:800;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin:0 auto 10px;max-width:40ch}
.sbar{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px;font-weight:800;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;width:max-content;max-width:100%;margin-inline:auto}
.sbar span{display:flex;gap:4px}
.sbar i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.sbar i.on{background:var(--good)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-bottom:12px}
.ccard{background:var(--card);border:4px solid var(--ink);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:0 5px 0 var(--ink);color:var(--ink)}
.ccard.fav{background:#fff4c2;border-color:var(--accent)}
.ccard.locked .cpic{filter:grayscale(1) brightness(.35);opacity:.6}
.ccard:focus-visible{outline:4px dashed var(--accent);outline-offset:3px}
.cpic{width:100%;max-width:130px}
.cname{font:800 1rem/1.15 var(--display);text-align:center;text-wrap:balance}
.ccost{font-weight:800;font-size:.9rem;color:var(--soft);display:flex;align-items:center;gap:3px}
.unlockpic{width:min(60vw,220px);margin:0 auto 8px;animation:hop .6s infinite alternate}
.endcard{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:22px;margin:18px auto;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.endcard h2{font:800 clamp(1.7rem,6vw,2.3rem)/1.1 var(--display);margin:0;text-wrap:balance}
.endcard p{margin:0;font-size:1.1rem}
.sleepcar{width:min(56vw,220px);position:relative}
.sleepcar svg{filter:saturate(.7)}
.zzz{position:absolute;top:-18px;right:-6px;font:800 1.4rem var(--display);color:var(--soft);animation:hop 1.2s infinite alternate}
.defi{background:#fff4c2;border:3px dashed var(--ink);border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;font-size:1.15rem;max-width:42ch}
.dayplan{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px;counter-reset:d}
.dayplan li{counter-increment:d;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font:800 1.15rem var(--display);display:flex;gap:10px;align-items:center}
.dayplan li::before{content:counter(d);width:28px;height:28px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;flex:none}
.dayplan li.done{opacity:.55;text-decoration:line-through}
.dayplan li.now{background:#fff4c2;border-color:var(--accent)}
.settings{border:2px solid #c9d3e6;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.settings h3{margin:0;font:800 1.3rem var(--display)}
.setrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.setrow input[type=checkbox],.gchk input{width:22px;height:22px;accent-color:var(--accent)}
.setgames{border:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.setgames legend{margin-bottom:6px}
.gchk{display:flex;align-items:center;gap:8px;font-weight:800}
.gchk.off{opacity:.5}
.gchk small{font-weight:600}
/* progress curve */
.spark{margin:2px 0 0}
.spark figcaption{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin-bottom:2px}
.spark svg{display:block;width:100%;height:auto;overflow:visible}
.sp-axis{stroke:#c9d3e6;stroke-width:1}
.sp-goal{stroke:#9aa5bd;stroke-width:1;stroke-dasharray:3 3}
.sp-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sp-dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.sp-dot.end{fill:var(--ink)}
.sp-hit{fill:transparent;cursor:help}
.sp-pt:hover .sp-dot{r:5}
.sp-lab{font:600 9px var(--body);fill:var(--soft)}
.sp-val{font:800 11px var(--body);fill:var(--ink)}
.spnote{font-size:.85rem;color:var(--soft);margin:0}
/* bus, week, wash */
.kidq{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:58px;align-items:flex-end}
.kid{width:clamp(28px,8vw,40px)}
.kid.sm{width:clamp(16px,4.6vw,24px)}
.kidok{font-weight:800;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:4px 12px}
.buses{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.buses.n3{grid-template-columns:repeat(3,1fr)}
.busbtn{overflow:hidden;background:var(--road);border:4px solid var(--ink);border-radius:18px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--ink);color:#fff}
.busbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.busbtn:focus-visible{outline:4px dashed var(--accent);outline-offset:3px}
.busbtn.go .bpic{animation:trainoff 1.2s .4s ease-in forwards}
.bpic{width:100%;max-width:150px}
.bkids{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:26px}
.bcount{font:800 1.8rem/1 var(--display);background:var(--card);color:var(--ink);border-radius:999px;min-width:44px;padding:2px 10px;font-variant-numeric:tabular-nums}
.minikids{display:flex;gap:2px;align-self:flex-end}
.minikids span{width:22px}
.daycar{position:relative;display:block;width:100%}
.dplate{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#fff;color:#1f2a44;border:2px solid #1f2a44;border-radius:5px;font:800 clamp(.55rem,2.4vw,.85rem)/1 var(--display);padding:2px 4px 0}
.weekrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px;padding:16px 10px;align-items:end}
.weekrow .tslot{aspect-ratio:120/64}
.weekrow .dplate{font-size:clamp(.7rem,3vw,1rem)}
.weekrow::after{display:none}
.weekrow > span{flex:1 1 0;min-width:0}
.weekrow .wk.hl{outline:3px solid var(--line);outline-offset:2px;border-radius:8px}
.todaycard{text-align:center;font-size:1.3rem;background:var(--card);border:4px solid var(--ink);border-radius:18px;padding:12px}
.todaycard b{font:800 1.6rem var(--display)}
.minidays{gap:4px}
.minidays > span{width:62px}
.washsign{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background:#fff;border:5px solid var(--ink);border-radius:16px;padding:12px 16px;box-shadow:0 6px 0 var(--ink)}
.wword{font:800 clamp(2.6rem,12vw,4rem)/1 var(--display);color:#1f2a44;letter-spacing:.04em}
.wword.cursive{font-family:"Playwrite FR Moderne","Segoe Script",cursive;font-weight:400;letter-spacing:0;font-size:clamp(2rem,9vw,3rem);padding-top:8px}
.dirty{position:relative;display:block;width:100%;max-width:120px;margin:0 auto}
.dirty i{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:#8a5a3c;opacity:.75;transition:opacity .6s,transform .6s}
.dirty i:nth-of-type(1){left:14%;top:30%}
.dirty i:nth-of-type(2){left:46%;top:46%;width:16%}
.dirty i:nth-of-type(3){left:70%;top:24%;width:18%}
.dirty.clean i{opacity:0;transform:scale(1.8)}
.miniwash{font:800 1.3rem var(--display);background:#fff;border:3px solid var(--ink);border-radius:8px;padding:2px 8px 0;align-self:center}
/* english mode */
.enhint{text-align:center;font-size:1.2rem;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;margin:0 auto;width:max-content;max-width:100%}
.enbadge{position:absolute;top:10px;left:12px;font:800 .75rem var(--body);background:#2f6fe4;color:#fff;border-radius:999px;padding:3px 9px}
.lot.static span{width:clamp(70px,21vw,110px);display:block}
/* hints + class view */
.hint{animation:hintpulse .8s ease-in-out infinite alternate;box-shadow:0 0 0 5px #2fb36b,0 6px 0 var(--ink)!important}
.szcar.hint,.spot.hint{box-shadow:none!important}
.szcar.hint{outline:5px solid #2fb36b;outline-offset:3px;border-radius:12px}
.spot.hint{stroke:#2fb36b;stroke-dasharray:none;stroke-width:5}
@keyframes hintpulse{to{transform:scale(1.06)}}
.cvwrap{overflow-x:auto;border:2px solid #c9d3e6;border-radius:14px}
.cv{border-collapse:collapse;font-size:.85rem;min-width:100%}
.cv th,.cv td{padding:8px 8px;border-bottom:1px solid #e1e7f0;text-align:center;white-space:nowrap}
.cv th:first-child,.cv td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:800}
.cv thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
.cv .pill{font-size:.72rem}
/* trace game */
.tracebox{border:4px solid var(--ink);border-radius:20px;overflow:hidden;background:#7cc96a}
.tsvg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.troad{fill:none;stroke:#4b4f5c;stroke-width:52;stroke-linecap:round;stroke-linejoin:round}
.tline{fill:none;stroke:#ffe066;stroke-width:3;stroke-dasharray:8 7;stroke-linecap:round}
.troad.later{stroke:#5f6577;opacity:.45}
.tline.later{opacity:.35}
.tdone{fill:none;stroke:#ff7a2f;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.tdot{fill:#2fb36b;stroke:#fff;stroke-width:3}
.tend{fill:#fff;stroke:#1f2a44;stroke-width:3;stroke-dasharray:3 3}
.tnumtxt{font:800 15px var(--display);fill:#fff;text-anchor:middle}
.tsvg.off{animation:shake .45s}
.tsvg.win .tdone{stroke:#2fb36b}
/* stories */
.storylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding-bottom:16px}
.storyc .cpic{display:flex;gap:4px;justify-content:center;align-items:flex-end}
.artit{display:block;width:clamp(64px,22vw,120px)}
.artit svg{width:100%;height:auto;display:block}
.storyc .artit{width:60px}
.kidart{display:block;width:60%;margin:0 auto}
.spage{background:var(--card);border:4px solid var(--ink);border-radius:24px;padding:16px;margin:14px 0;display:flex;flex-direction:column;gap:12px}
.shead{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:800}
.sart{display:flex;justify-content:center;align-items:flex-end;gap:12px;flex-wrap:wrap;min-height:120px;background:#dff3ff;border-radius:16px;padding:12px}
.stext{font:800 clamp(1.25rem,5vw,1.6rem)/1.35 var(--display);margin:0;text-wrap:pretty}
.qart{display:flex;gap:2px;justify-content:center;align-items:flex-end}
.qart .artit{width:clamp(44px,13vw,72px)}
.sleepcar.small{display:block;width:clamp(80px,26vw,130px)}
.minibook{font:800 .95rem var(--display);background:#fff4c2;border:2px solid var(--ink);border-radius:8px;padding:4px 8px;align-self:center}
/* orders game */
.ordlot{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:18px 12px}
.ordlot::after{display:none}
.orditem{border:none;background:none;padding:4px;cursor:pointer;position:relative;border-radius:14px}
.orditem svg{width:100%}
.orditem .num{position:absolute;top:-10px;right:-4px;background:var(--line);color:var(--ink);font:800 1.3rem var(--display);width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);display:none;align-items:center;justify-content:center}
.orditem.on .num{display:flex}
.orditem.on{background:rgba(255,224,102,.25)}
.orditem.wrong{animation:shake .45s}
.orditem:focus-visible{outline:4px dashed var(--line)}
.orditem.hint{outline:5px solid #2fb36b;box-shadow:none!important}
.ordsteps{display:flex;align-items:center;gap:8px}
.ordsteps i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.ordsteps i.on{background:var(--good)}
.miniord{display:flex;gap:6px}
.miniord > span{width:60px;position:relative}
.miniord b{position:absolute;top:-8px;right:-4px;background:var(--line);border:2px solid var(--ink);border-radius:50%;width:22px;height:22px;font-size:.8rem;display:flex;align-items:center;justify-content:center}
/* permits, duo, sync */
.permits{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:12px}
.permit{display:flex;flex-direction:column;align-items:center;gap:8px}
.permitimg > svg{display:block;width:100%;height:auto}
.permitimg{width:100%;max-width:340px}
.party .permitimg{margin:0 auto 10px;animation:hop .6s infinite alternate}
.permit.locked{border:3px dashed #9aa5bd;border-radius:16px;min-height:64px;padding:8px;justify-content:center;color:var(--soft);font-weight:800;background:rgba(255,255,255,.55)}
.permit.locked small{font-weight:600}
.duobar{background:#fff4c2}
.turncard h2{font-size:clamp(2rem,9vw,3rem)}
.duoopts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
/* home 6 + next game */
.choosehead{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px 0}
.choosehead h2{font:800 clamp(1.6rem,6vw,2.2rem)/1.1 var(--display);margin:0;text-align:center;text-wrap:balance}
.choose2{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.choose2 .mode{font-size:clamp(1.3rem,5vw,1.7rem)!important;padding:26px 10px!important;min-height:210px;justify-content:center;gap:16px}
.choose2 .pic{padding:0 4px}
@media (max-width:560px){.menu{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mode{padding:30px 8px 12px;font-size:1.15rem;line-height:1.15;text-align:center;border-radius:22px}.mode small{font-size:.78rem;line-height:1.25}.mode .pic{gap:3px;flex-wrap:nowrap;align-items:flex-end;justify-content:center;width:100%;min-height:48px}.mode .pic > svg{width:31%!important;flex:none}.mode .pic > span{max-width:33%;flex:0 1 auto}.mstars{top:6px;right:8px;font-size:.95rem}.enbadge{top:6px;left:8px}}
.morebar{display:flex;justify-content:center;margin:18px 0 6px}
.morebtn{background:#2f6fe4;padding:14px 26px}
.nextcar{display:block;width:min(50vw,200px);animation:drive .9s cubic-bezier(.2,.8,.3,1)}
/* ---- nouvelles activités ---- */
.qcard{display:inline-flex;align-items:center;justify-content:center;width:34px;height:42px;border:3px solid var(--ink);border-radius:8px;background:var(--accent);font:800 1.4rem var(--display);color:#fff}
.memgrid{width:100%;display:grid;grid-template-columns:repeat(var(--c),1fr);gap:clamp(6px,2vw,12px);max-width:560px;margin:0 auto}
.memcard{position:relative;aspect-ratio:1/1;border:4px solid var(--ink);border-radius:18px;background:var(--card);cursor:pointer;padding:0;box-shadow:0 5px 0 var(--ink);overflow:hidden}
.memcard .memback{position:absolute;inset:0;background:repeating-linear-gradient(45deg,var(--accent) 0 12px,#ff9a5c 12px 24px)}
.memcard .memfront{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:8%}
.memcard.up .memback{display:none}.memcard.up .memfront{display:flex}
.memcard.found{border-color:var(--good);box-shadow:0 5px 0 var(--good)}
.face{display:block;width:100%;max-width:150px}
.situcard{background:var(--card);border:3px dashed var(--ink);border-radius:18px;padding:12px 16px;font-size:1.2rem;font-weight:700;text-align:center;margin:0 auto 14px;max-width:560px}
.pboard{position:relative;display:grid;grid-template-columns:repeat(var(--c),1fr);width:min(100%,480px);aspect-ratio:3/2;margin:0 auto;border:4px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.pboard.win{border-color:var(--good)}
.pghost{position:absolute;inset:0;background-size:100% 100%;pointer-events:none}
.pslot{position:relative;border:1.5px dashed #9aa5bd;background:transparent;cursor:pointer;padding:0;background-repeat:no-repeat}
.pslot.full{border-color:transparent}
.pslot.hint{outline:4px solid var(--accent);outline-offset:-4px}
.pslot.no{animation:shake .4s}
.ptray{width:100%;display:grid;grid-template-columns:repeat(var(--c),1fr);gap:8px;width:min(100%,480px);margin:14px auto 0}
.ppiece{aspect-ratio:3/2;border:3px solid var(--ink);border-radius:8px;cursor:pointer;padding:0;background-repeat:no-repeat;box-shadow:0 4px 0 var(--ink)}
.ppiece.sel{outline:5px solid var(--accent);transform:translateY(-3px)}
.shadowscene{display:flex;justify-content:center;padding:14px 0;margin-bottom:14px}
.shadowscene > span{width:min(55%,240px)}
.shadow svg{filter:brightness(0)}
.shadow.small,.shcolor.small{display:block;width:100%}
.pumprow{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px}
.pump{background:#e63946;color:#fff;border:4px solid var(--ink);border-radius:16px 16px 6px 6px;padding:10px 16px;text-align:center;box-shadow:0 5px 0 var(--ink)}
.pump small{display:block;font-weight:700}.pump b{font:800 2.2rem/1 var(--display)}
.pumpcar{width:120px}
.paid{display:flex;flex-direction:column;align-items:center;font-weight:700}.paid svg{width:80px}
.tray{min-height:76px;border:4px dashed var(--ink);border-radius:18px;background:var(--card);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px;max-width:560px;margin:0 auto 12px}
.trayhint{color:#5a6480;font-weight:700}
.tcoin,.coin{background:none;border:0;padding:0;cursor:pointer}
.tcoin.c1,.tcoin.c2{width:44px}.tcoin.c5,.tcoin.c10{width:66px}
.wallet{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:12px}
.coin.c1,.coin.c2{width:clamp(64px,18vw,84px)}.coin.c5,.coin.c10{width:clamp(96px,26vw,124px)}
.coin:active{transform:scale(.94)}
.rpattern,.rmine{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;min-height:34px;margin:6px 0 14px}
.rpattern.hidden2{visibility:hidden}
.rgroup{display:flex;gap:6px}
.rpattern i,.rmine i{width:24px;height:24px;border-radius:50%;background:#cfd6e4;border:3px solid var(--ink);display:inline-block}
.rpattern i.on{background:var(--accent);transform:scale(1.25)}
.rmine{gap:6px}.rmine i{background:var(--good)}
.xbox{max-width:560px;margin:0 auto 12px;border:4px solid var(--ink);border-radius:18px;overflow:hidden}
.xscene{display:block;width:100%}
.xcar{transform:translateX(-140px)}
.xscene.moving .xcar{animation:xdrive 3.2s linear infinite}
.xscene.moving .xcar.x2{animation-direction:reverse;animation-delay:-1.4s}
@keyframes xdrive{from{transform:translateX(-140px)}to{transform:translateX(420px)}}
#xkid{transition:transform 2.2s ease-in-out}
#xkid.walk{transform:translate(178px,14px)}
.looks{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.looks .on{background:var(--good);color:#fff}
.xicon{display:block;width:100%;max-width:120px}
.clab{font-weight:800;font-size:1rem;line-height:1.15}
.paintbox{max-width:480px;margin:0 auto 12px;background:var(--card);border:4px solid var(--ink);border-radius:18px;padding:12px}
.paintbox [data-r]{cursor:pointer}
.palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.swatch2{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);cursor:pointer}
.swatch2.sel,.sticker.sel{outline:4px solid var(--accent);outline-offset:2px}
.stickers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.sticker{width:56px;height:56px;border:3px solid var(--ink);border-radius:12px;background:var(--card);cursor:pointer;padding:4px;display:flex;flex-direction:column;align-items:center}

#decor .cloud::before,#decor .cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
#decor .cloud::before{width:56px;height:56px;left:16px;top:-28px}
#decor .cloud::after{width:42px;height:42px;left:60px;top:-18px}
#decor .c1{top:90px;animation-duration:70s;animation-delay:-20s}
#decor .c2{top:200px;transform:scale(.7);animation-duration:95s;animation-delay:-60s;opacity:.7}
#decor .c3{top:40px;transform:scale(.55);animation-duration:120s;animation-delay:-5s;opacity:.6}
#decor .droad{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--road);border-top:4px solid var(--ink);display:none}

#decor .dcar2 svg{animation:bump 1s ease-in-out infinite alternate}
.onhome .app{padding-bottom:76px}

let soundOn = true, actx = null, frVoice = null, enVoice = null, speakLang = "fr";
// les voix « naturelles » (Edge : Microsoft … Online (Natural), Google, Siri améliorées) passent en premier
function voiceScore(v){
  const n = v.name || "";
  let sc = 0;
  if(/natural|naturelle/i.test(n)) sc += 100;
  if(/online/i.test(n)) sc += 60;
  if(/neural|premium|enhanced|améliorée|siri/i.test(n)) sc += 50;
  if(/google/i.test(n)) sc += 40;
  if(/denise|vivienne|eloise|henri|remy|amélie|audrey|aurélie/i.test(n)) sc += 10;
  if(/fr(-|_)FR/i.test(v.lang)) sc += 5;
  if(/compact|espeak/i.test(n)) sc -= 50;
  return sc;
}
const isNatural = v => voiceScore(v) >= 40;
function loadVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    frVoice = vs.filter(v => /^fr/i.test(v.lang)).sort((a,b) => voiceScore(b) - voiceScore(a))[0] || null;
    enVoice = vs.filter(v => /^en/i.test(v.lang)).sort((a,b) => voiceScore(b) - voiceScore(a) + (/GB/i.test(b.lang) ? 1 : 0) - (/GB/i.test(a.lang) ? 1 : 0))[0] || null;
  }catch(e){}
}
try{ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }catch(e){}
function say(text, cb){
  try{ showSubs(text); }catch(e){}
  let called = false;
  const fin = () => { if(!called){ called = true; cb && cb(); } };
  if(!soundOn){ fin(); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if(speakLang === "en"){ u.lang = "en-GB"; if(enVoice) u.voice = enVoice; } else { u.lang = "fr-FR"; if(frVoice) u.voice = frVoice; }
    u.rate = (typeof pdata !== "undefined" && pdata && pdata.settings && pdata.settings.voiceRate) || .9; u.pitch = 1;
    if(speakLang !== "en" && typeof pdata !== "undefined" && pdata && pdata.settings && pdata.settings.voiceName){ const v = speechSynthesis.getVoices().find(x => x.name === pdata.settings.voiceName); if(v) u.voice = v; }
    if(cb){ u.onend = fin; u.onerror = fin; setTimeout(fin, 900 + text.length * 75); }
    const ag = document.getElementById("again");
    if(ag){ ag.classList.add("talking"); const off = () => ag.classList.remove("talking"); u.addEventListener("end", off); u.addEventListener("error", off); setTimeout(off, 900 + text.length * 75); }
    speechSynthesis.speak(u);
  }catch(e){ fin(); }
}
function beep(kind){
  if(!soundOn) return;
  try{ flashSignal(kind); }catch(e){}
  if(kind === "bad"){ try{ fxPuff(); }catch(e){} }
  if((kind === "honk" || kind === "bad") && typeof isCalm === "function" && typeof pdata !== "undefined" && pdata && isCalm()) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = kind==="good" ? [523,659,784] : kind==="honk" ? [392,392] : kind==="tap" ? [660] : [220];
    notes.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind==="honk" ? "square" : "triangle"; o.frequency.value = f;
      const t = actx.currentTime + i*.12;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.2);
    });
  }catch(e){}
}

// ---------- results tracking (parents) ----------
let stats = {};
function saveStats(){ saveProfileData(); }
function blankStat(){ return {rounds:0, first:0, errors:0, ms:0, timed:0, level:0, missed:{}, days:{}}; }
function gstat(game){ if(!stats[game]) stats[game] = blankStat(); return stats[game]; }
function today(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function track(game, item, noTime){
  if(duo && duo.turn === 1){ let e = 0; return {get errors(){ return e; }, wrong(){ e++; }, right(){}}; }
  const t0 = Date.now(); let errs = 0, closed = false;
  return {
    get errors(){ return errs; },
    wrong(){
      if(closed) return; errs++;
      if(item != null){ const g = gstat(game); g.missed[item] = (g.missed[item]||0) + 1; saveStats(); }
    },
    right(lvl){
      if(closed) return; closed = true;
      const g = gstat(game);
      g.rounds++; if(!errs) g.first++; g.errors += errs;
      const ms = Date.now() - t0;
      if(!noTime && ms < 60000){ g.ms += ms; g.timed++; }
      if(lvl != null) g.level = Math.max(g.level || 0, lvl);
      const d = today(); g.days[d] = g.days[d] || [0,0]; g.days[d][0]++; if(!errs) g.days[d][1]++;
      checkPermit(game);
      saveStats();
      try{ adaptLevel(game, errs); }catch(e){}
    }
  };
}

function verdict(sk, g){
  if(!g || g.rounds < sk.min) return {txt:"Pas assez de parties", cls:"n"};
  const p = g.first / g.rounds;
  if(p >= .8) return {txt:"Acquis", cls:"g"};
  if(p >= .5) return {txt:"En cours", cls:"m"};
  return {txt:"À travailler", cls:"l"};
}
const pct = (a,b) => b ? Math.round(100*a/b) + " %" : "–";
const secs = g => g && g.timed ? (g.ms/g.timed/1000).toFixed(1).replace(".", ",") + " s" : "–";
function missedList(g){
  if(!g) return "";
  return Object.entries(g.missed).sort((a,b) => b[1]-a[1]).slice(0,5).map(([k,v]) => `${k} (${v})`).join(", ");
}
function reportText(){
  const lines = [`Bilan de ${displayName()} – ${new Date().toLocaleDateString("fr-FR")}`];
  SKILLS.forEach(sk => {
    const g = stats[sk.id], v = verdict(sk, g);
    if(!g || !g.rounds){ lines.push(`${sk.label} : pas encore joué`); return; }
    let l = `${sk.label} : ${g.rounds} parties, ${pct(g.first,g.rounds)} réussies sans erreur`;
    if(g.timed) l += `, temps moyen ${secs(g)}`;
    if(sk.lvl && g.level) l += `, niveau ${sk.lvl(g.level)}`;
    const sp = progressSeries(g);
    if(sp) l += `, évolution par ${sp.unit} ${sp.pts[0].p} % → ${sp.pts[sp.pts.length - 1].p} %`;
    l += ` → ${v.txt}`;
    const m = sk.item ? missedList(g) : "";
    if(m) l += ` (${sk.item.toLowerCase()} : ${m})`;
    lines.push(l);
  });
  const days = new Set(); Object.values(stats).forEach(g => Object.keys(g.days||{}).forEach(d => days.add(d)));
  lines.push(`Jours joués : ${days.size}`);
  return lines.join("\n");
}

function addStar(){
  if(duo){ duo.score[duo.turn]++; if(duo.turn === 1){ const b = app.querySelector(".duobar"); if(b) b.outerHTML = duoBar(); return false; } }

  const el = document.getElementById("starN"); if(el){ el.textContent = shownStars(); el.parentElement.classList.remove("popin"); void el.offsetWidth; el.parentElement.classList.add("popin"); }

function ac(){
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state === "suspended") actx.resume();
  return actx;
}
function osc(c, type, f, t0, dur, vol, dest){

  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .02);
  g.gain.setValueAtTime(vol, t0 + dur - .05); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(dest || c.destination); o.start(t0); o.stop(t0 + dur + .02);
  return o;
}

  pinpon(c, t){ const lp = lowpass(c, 2200); for(let i=0;i<6;i++) osc(c,"square",i%2?488:435,t+i*.46,.44,.1,lp); return 2.8; },
  moto(c, t){

let sizeN = 3, sizeStreak = 0;
function sizeGame(){
  const n = sizeN;
  const scales = Array.from({length:n}, (_,i) => n === 1 ? 1 : 0.42 + i * (0.58/(n-1)));
  const hexes = shuffle(COLORS).slice(0,n).map(c => c.hex);
  // each car: its rank (0 = smallest) and colour
  const cars = scales.map((s,i) => ({rank:i, s, hex:hexes[i]}));
  let order; do { order = shuffle(cars); } while(n > 1 && order.every((c,i) => c.rank === i));
  app.innerHTML = `${topBar(true)}
    <div class="prompt"><span>De la plus petite à la plus grande !</span>
      <button class="again" id="again" aria-label="Réécouter la consigne">🔊</button></div>

      </div></div>
    </div>`;
  wireTop();
  // fit sizes to the screen width
  const sum = scales.reduce((a,b) => a+b, 0);
  const avail = Math.min(app.clientWidth - 32, 860) - (n-1)*10 - 28;
  const u = Math.max(40, Math.min(170, avail / sum));
  app.style.setProperty("--u", u + "px");
  const line = "Range les voitures sur la route, de la plus petite à la plus grande. Commence par la plus petite !";
  say(line);

// ---------- train (logical sequences) ----------
const TRAIN_START = {PS:0, MS:1, GS:2, CP:4}, TRAIN_MAX = {PS:1, MS:2, GS:3, CP:4};
const TRAIN_NAMES = ["2 couleurs", "3 couleurs ou tailles", "suites doubles", "couleur et taille", "suites de nombres"];
let trainLvl = 1, trainStreak = 0;
const tkey = it => it.hex + "|" + (it.small ? 1 : 0) + "|" + (it.num == null ? "" : it.num);
function tcar(it){
  return `<span class="tcar${it.small ? " small" : ""}">${car(it.hex)}${it.num != null ? `<span class="tnum">${it.num}</span>` : ""}</span>`;
}
function makeTrain(lvl){
  const cols = shuffle(COLORS).map(c => c.hex);
  const C = i => ({hex: cols[i]});
  if(lvl >= 4){
    const step = pick([1,2,5,10]);
    const start = step === 10 ? 10 * (1 + rnd(3)) : step === 5 ? 5 * rnd(4) : 1 + rnd(10);
    const all = Array.from({length:5}, (_,i) => ({hex: cols[i % 2], num: start + i * step}));
    const ans = all.pop();
    const opts = new Set([ans.num]);
    while(opts.size < 3){ const d = ans.num + pick([-step, step, -1, 1, 2]); if(d >= 0) opts.add(d); }
    return {shown: all, ans, choices: shuffle([...opts]).map(n => ({hex: ans.hex, num: n})), step};
  }
  let unit, extra;
  if(lvl === 0){ unit = [C(0), C(1)]; extra = [C(2)]; }
  else if(lvl === 1){
    if(Math.random() < .5){ unit = [C(0), C(1), C(2)]; extra = [C(3)]; }
    else { unit = [{hex: cols[0]}, {hex: cols[0], small: true}]; extra = [{hex: cols[1]}]; }
  }
  else if(lvl === 2){ const t = pick(["AAB","ABB","AABB"]); unit = [...t].map(ch => C(ch === "A" ? 0 : 1)); extra = [C(2)]; }
  else { unit = [{hex: cols[0]}, {hex: cols[1], small: true}]; extra = [{hex: cols[0], small: true}, {hex: cols[1]}]; }
  const L = Math.min(8, unit.length * 2 + rnd(unit.length));
  const shown = Array.from({length: L}, (_,i) => unit[i % unit.length]);
  const ans = unit[L % unit.length];
  const seen = new Set([tkey(ans)]), others = [];
  shuffle([...unit, ...extra]).forEach(it => { if(!seen.has(tkey(it)) && others.length < 2){ seen.add(tkey(it)); others.push(it); } });
  return {shown, ans, choices: shuffle([ans, ...others])};
}
function trainGame(){
  const lvl = trainLvl, tr = makeTrain(lvl), numbers = lvl >= 4;
  app.innerHTML = `${topBar(true)}
    <div class="prompt"><span>${numbers ? "Quel numéro vient après ?" : "Quelle voiture continue le train ?"}</span>

const DIRS = {up:[0,-1,"en haut","⬆"], down:[0,1,"en bas","⬇"], left:[-1,0,"à gauche","⬅"], right:[1,0,"à droite","➡"]};

function bfs(n, trees, s, t){

// ---- taille : balance (MS) ----
const HEAVY = [["velo",1],["moto",2],["voiture",3],["pompiers",4],["train",5]];
const vehInner = k => VEH[k].svg.replace(/^\s*<svg[^>]*>/, "").replace(/<\/svg>\s*$/, "");
function balanceGame(){
  const [A, B] = shuffle(HEAVY).slice(0,2), heavier = A[1] > B[1] ? 0 : 1, askHeavy = Math.random() < .6;
  const ang = heavier === 0 ? -11 : 11, rad = ang * Math.PI / 180, L = 120, px = 200, py = 70;
  const end = s => [px + s * L * Math.cos(rad), py + s * L * Math.sin(rad)];
  const [lx, ly] = end(-1), [rx, ry] = end(1);
  const pan = (x, y, k) => `<line x1="${x}" y1="${y}" x2="${x}" y2="${y + 34}" stroke="#1f2a44" stroke-width="3"/><path d="M${x-48} ${y+34} H${x+48} L${x+38} ${y+44} H${x-38} Z" fill="#cfd6e4" stroke="#1f2a44" stroke-width="3" stroke-linejoin="round"/><g transform="translate(${x-42},${y+34-42}) scale(.7)">${vehInner(k)}</g>`;
  const scene = `<div class="posbox"><svg viewBox="0 0 400 230" class="posscene" role="img" aria-label="Une balance">
      <rect width="400" height="230" fill="#dff3ff"/>
      <path d="M200 70 L170 214 H230 Z" fill="#8a5a3c" stroke="#1f2a44" stroke-width="3" stroke-linejoin="round"/>
      <rect x="140" y="212" width="120" height="12" rx="4" fill="#1f2a44"/>
      <line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" stroke="#1f2a44" stroke-width="7" stroke-linecap="round"/>
      <circle cx="200" cy="70" r="8" fill="#ffc93c" stroke="#1f2a44" stroke-width="3"/>
      ${pan(lx, ly, A[0])}${pan(rx, ry, B[0])}

  const pair = [A, B], right = askHeavy ? heavier : 1 - heavier;
  choiceRound({
    title: askHeavy ? "Lequel est le plus lourd ?" : "Lequel est le plus léger ?",
    line: askHeavy ? "Regarde la balance. Lequel est le plus lourd ?" : "Regarde la balance. Lequel est le plus léger ?",

    choices: pair.map(p => ({label: VEH[p[0]].label, html: `${VEH[p[0]].svg}<span class="clab">${VEH[p[0]].label}</span>`})),
    isRight: i => i === right,

    onWrong: () => askHeavy ? "Regarde : le côté le plus lourd descend." : "Regarde : le côté le plus léger reste en haut.",

}

    <path d="M${w - cab} 50 V24 Q${w - cab} 18 ${w - cab + 6} 18 H${w - 22} L${w - 2} 34 V50 Z" fill="${shade(hex,-.15)}" stroke="#1f2a44" stroke-width="3" stroke-linejoin="round"/>
    <path d="M${w - cab + 8} 24 H${w - 26} L${w - 12} 34 H${w - cab + 8} Z" fill="#dff3ff" stroke="#1f2a44" stroke-width="2"/>

function unitGame(){

  const ids = k === "compter" ? ["compter","problemes"] : [k];
  const gs = ids.map(i => stats[i]).filter(g => g && g.rounds >= 3);

  return Math.min(...gs.map(g => g.first / g.rounds));

// ---------- progress curve in the parents report ----------
function weekStart(ds){ const d = new Date(ds + "T12:00:00"); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return d.toISOString().slice(0,10); }
const frDate = ds => { const [y,m,d] = ds.split("-"); return `${d}/${m}`; };
function progressSeries(g){
  const days = Object.entries(g.days || {}).filter(([,v]) => v[0] > 0).sort();
  const weeks = {};
  days.forEach(([d,v]) => { const w = weekStart(d); weeks[w] = weeks[w] || [0,0]; weeks[w][0] += v[0]; weeks[w][1] += v[1]; });
  const wk = Object.entries(weeks).sort();
  if(wk.length >= 2) return {unit:"semaine", pts: wk.slice(-8).map(([d,v]) => ({d, n:v[0], p: Math.round(100*v[1]/v[0])}))};
  if(days.length >= 2) return {unit:"jour", pts: days.slice(-10).map(([d,v]) => ({d, n:v[0], p: Math.round(100*v[1]/v[0])}))};
  return null;
}
function sparkHtml(g){
  if(!g || !g.rounds) return "";
  const s = progressSeries(g);
  if(!s) return `<p class="spnote">La courbe de progrès apparaîtra après 2 jours de jeu.</p>`;
  const Wd = 280, H = 92, L = 30, R = 34, T = 10, B = 22, n = s.pts.length;
  const x = i => L + (n === 1 ? 0 : i * (Wd - L - R) / (n - 1)), y = p => T + (100 - p) * (H - T - B) / 100;
  const path = s.pts.map((q,i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(q.p).toFixed(1)}`).join(" ");
  const last = s.pts[n - 1];
  const tip = q => `${s.unit === "semaine" ? "Semaine du " : "Le "}${frDate(q.d)} : ${q.p} % sans erreur (${q.n} partie${q.n > 1 ? "s" : ""})`;
  return `<figure class="spark">
    <figcaption>Réussite sans erreur, par ${s.unit}</figcaption>
    <svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Réussite par ${s.unit} : ${s.pts.map(q => frDate(q.d) + " " + q.p + " %").join(", ")}">
      <line x1="${L}" x2="${Wd - R}" y1="${y(0)}" y2="${y(0)}" class="sp-axis"/>
      <line x1="${L}" x2="${Wd - R}" y1="${y(80)}" y2="${y(80)}" class="sp-goal"/>
      <text x="${L - 4}" y="${y(80) + 3.5}" class="sp-lab" text-anchor="end">80 %</text>
      <text x="${L - 4}" y="${y(0) + 3.5}" class="sp-lab" text-anchor="end">0</text>
      <path d="${path}" class="sp-line"/>
      ${s.pts.map((q,i) => `<g class="sp-pt"><circle cx="${x(i)}" cy="${y(q.p)}" r="10" class="sp-hit"><title>${tip(q)}</title></circle><circle cx="${x(i)}" cy="${y(q.p)}" r="${i === n - 1 ? 4.5 : 3}" class="sp-dot${i === n - 1 ? " end" : ""}"/></g>`).join("")}
      <text x="${x(n - 1) + 8}" y="${y(last.p) + 4}" class="sp-val">${last.p} %</text>
      <text x="${x(0)}" y="${H - 6}" class="sp-lab" text-anchor="${n === 1 ? "middle" : "start"}">${frDate(s.pts[0].d)}</text>
      ${n > 1 ? `<text x="${x(n - 1)}" y="${H - 6}" class="sp-lab" text-anchor="end">${frDate(last.d)}</text>` : ""}
    </svg>
  </figure>`;
}

  wireTop();

  say(line);
  const T = track("bus", `${total} en ${nb}`);
  document.getElementById("again").onclick = () => say(line);
  const draw = () => {
    document.getElementById("kidq").innerHTML = queue.length ? queue.map(h => `<span class="kid">${KID(h)}</span>`).join("") : `<span class="kidok">Tout le monde est monté !</span>`;

  };

  app.querySelectorAll(".busbtn").forEach(b => b.onclick = () => {

    const i = +b.dataset.b; inBus[i].push(queue.shift()); beep("tap"); draw(); say(numWord(inBus[i].length));
  });
  const reset = () => { queue = [...kidCols]; inBus = inBus.map(() => []); draw(); };
  document.getElementById("breset").onclick = () => { if(!done) reset(); };
  document.getElementById("bgo").onclick = () => {
    if(done) return;
    if(queue.length){ say("Il reste des enfants qui attendent. Fais-les monter dans les bus !"); return; }
    if(inBus.every(k => k.length === per)){
      done = true; beep("good"); T.right(null);
      app.querySelectorAll(".busbtn").forEach(x => x.classList.add("go"));
      const party = addStar();
      say(`Bravo ! ${numWord(per)} enfant${per > 1 ? "s" : ""} dans chaque bus.${g === "CP" ? ` ${total} partagés en ${nb}, ça fait ${per}.` : ""}`);
      setTimeout(() => party ? celebrate(flow(busGame)) : flow(busGame)(), 3400);
    } else {
      T.wrong(); beep("bad"); say("Oh ! Les bus n'ont pas le même nombre d'enfants. Regarde les nombres, et recommence.");
      setTimeout(reset, 1800);
    }
  };
}

const DAYS = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const DAYCOL = ["#e63946","#ff7a2f","#ffc93c","#2fb36b","#2f6fe4","#8e5ae8","#ff6fb1"];
const dayCar = i => `<span class="daycar">${car(DAYCOL[i])}<span class="dplate">${DAYS[i].slice(0,3).toUpperCase()}</span></span>`;
function weekGame(){
  const g = gradeKey(), todayIdx = (new Date().getDay() + 6) % 7;
  let mode = g === "MS" ? "after" : g === "GS" ? pick(["after","before","tomorrow"]) : pick(["missing","before","tomorrow","yesterday"]);
  let ask, answer, line, title, rowMissing = -1;
  if(mode === "tomorrow"){ answer = (todayIdx + 1) % 7; title = "Demain, c'est quel jour ?"; line = `Aujourd'hui, c'est ${DAYS[todayIdx]}. Et demain, c'est quel jour ?`; }
  else if(mode === "yesterday"){ answer = (todayIdx + 6) % 7; title = "Hier, c'était quel jour ?"; line = `Aujourd'hui, c'est ${DAYS[todayIdx]}. Et hier, c'était quel jour ?`; }
  else if(mode === "missing"){ rowMissing = rnd(7); answer = rowMissing; title = "Quel jour manque ?"; line = "Une voiture est partie du parking de la semaine. Quel jour manque ?"; }
  else { ask = mode === "after" ? rnd(6) : 1 + rnd(6); answer = mode === "after" ? ask + 1 : ask - 1;
    title = mode === "after" ? `Quel jour vient après ${DAYS[ask]} ?` : `Quel jour vient avant ${DAYS[ask]} ?`; line = title; }
  const opts = new Set([answer]); while(opts.size < 3) opts.add(rnd(7));
  const keys = shuffle([...opts]);
  const showRow = g === "MS" || mode === "missing";
  const scene = showRow ? `<div class="road weekrow">${DAYS.map((d,i) => i === rowMissing ? `<span class="tslot">?</span>` : `<span class="wk${i === ask ? " hl" : ""}">${dayCar(i)}</span>`).join("")}</div>`
    : `<div class="todaycard">Aujourd'hui : <b>${DAYS[todayIdx]}</b></div>`;
  choiceRound({
    title, line, scene,
    choices: keys.map(i => ({label: DAYS[i], html: `${dayCar(i)}<span class="clab">${DAYS[i]}</span>`})),
    isRight: i => keys[i] === answer,
    onRight: () => `Oui ! C'est ${DAYS[answer]}. Lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche !`,
    onWrong: i => `Ça, c'est ${DAYS[keys[i]]}. Chante les jours dans l'ordre pour trouver.`,
    game: "semaine", item: mode === "missing" ? "jour manquant" : mode === "after" ? "jour d'après" : mode === "before" ? "jour d'avant" : mode === "tomorrow" ? "demain" : "hier",
    next: weekGame, wait: 4200
  });
}

const LETTER_STROKES = {
  A:["M10 140 L50 0 L90 140","M27 90 H73"], B:["M15 0 V140","M15 0 H55 Q90 0 90 35 Q90 70 55 70 H15","M15 70 H60 Q95 70 95 105 Q95 140 60 140 H15"],
  C:["M90 25 Q75 0 50 0 Q5 0 5 70 Q5 140 50 140 Q75 140 90 115"], D:["M15 0 V140","M15 0 H45 Q95 0 95 70 Q95 140 45 140 H15"],
  E:["M85 0 H15 V140 H85","M15 70 H70"], F:["M85 0 H15 V140","M15 70 H70"], G:["M90 25 Q75 0 50 0 Q5 0 5 70 Q5 140 50 140 Q90 140 90 100 V80 H55"],
  H:["M15 0 V140","M85 0 V140","M15 70 H85"], I:["M50 0 V140"], J:["M70 0 V105 Q70 140 40 140 Q15 140 10 115"],
  K:["M15 0 V140","M85 0 L15 80","M40 60 L85 140"], L:["M20 0 V140 H85"], M:["M10 140 V0 L50 80 L90 0 V140"], N:["M15 140 V0 L85 140 V0"],
  O:["M50 0 Q5 0 5 70 Q5 140 50 140 Q95 140 95 70 Q95 0 50 0"], P:["M15 140 V0 H55 Q90 0 90 37 Q90 75 55 75 H15"],
  Q:["M50 0 Q5 0 5 70 Q5 140 50 140 Q95 140 95 70 Q95 0 50 0","M60 105 L95 140"], R:["M15 140 V0 H55 Q90 0 90 37 Q90 75 55 75 H15","M50 75 L90 140"],
  S:["M88 20 Q75 0 50 0 Q12 0 12 35 Q12 65 50 70 Q90 75 90 105 Q90 140 50 140 Q22 140 10 118"], T:["M5 0 H95","M50 0 V140"],
  U:["M15 0 V95 Q15 140 50 140 Q85 140 85 95 V0"], V:["M10 0 L50 140 L90 0"], W:["M5 0 L28 140 L50 50 L72 140 L95 0"],
  X:["M12 0 L88 140","M88 0 L12 140"], Y:["M10 0 L50 70 L90 0","M50 70 V140"], Z:["M12 0 H88 L12 140 H88"]
};
function loops(h){ let d = "M30 200", x = 30; for(let i = 0; i < 4; i++){ d += ` C${x+50} 200 ${x+58} ${h} ${x+38} ${h} C${x+18} ${h} ${x+26} 200 ${x+80} 200`; x += 80; } return d; }
const TRACES = {
  ligne:     {name:"une ligne droite", strokes:["M50 130 H350"]},
  descente:  {name:"une ligne qui descend", strokes:["M200 30 V230"]},
  pont:      {name:"un pont", strokes:["M50 210 Q200 -70 350 210"]},
  rond:      {name:"un rond", strokes:["M200 35 A95 95 0 1 0 199.9 35"]},
  vagues:    {name:"des vagues", strokes:["M30 130 Q70 50 110 130 T190 130 T270 130 T350 130"]},
  montagnes: {name:"des montagnes", strokes:["M30 200 L85 70 L140 200 L195 70 L250 200 L305 70 L360 200"]},
  ponts:     {name:"des ponts", strokes:["M30 200 A45 70 0 0 1 120 200 A45 70 0 0 1 210 200 A45 70 0 0 1 300 200 A35 70 0 0 1 370 200"]},
  boucles:   {name:"des boucles", strokes:[loops(60)]},
  petites:   {name:"des petites boucles", strokes:[loops(130)]}
};
const TRACE_POOL = {PS:["ligne","descente","pont","rond"], MS:["vagues","montagnes","ponts","rond","pont"], GS:["boucles","ponts","lettre","lettre"], CP:["boucles","petites","lettre","lettre"]};
let lastTrace = "";
function letterTrace(L){
  const s = 1.25, ox = 200 - 50 * s, oy = 130 - 70 * s;
  const tf = d => d.replace(/([MLHVQTAC])([^MLHVQTAC]*)/g, (m, cmd, args) => {
    const n = args.trim().split(/[\s,]+/).filter(Boolean).map(Number);
    if(cmd === "H") return "H" + (ox + n[0] * s).toFixed(1) + " ";
    if(cmd === "V") return "V" + (oy + n[0] * s).toFixed(1) + " ";
    const out = n.map((v,i) => (i % 2 ? oy + v * s : ox + v * s).toFixed(1));
    return cmd + out.join(" ") + " ";
  });
  return {name: `la lettre ${LETTER_SAY[L] || L}`, strokes: LETTER_STROKES[L].map(tf), letter: L};
}
function traceGame(){
  const g = gradeKey();
  let key; do { key = pick(TRACE_POOL[g]); } while(key === lastTrace && key !== "lettre");
  lastTrace = key;
  let tr;
  if(key === "lettre"){ const letters = [...getName()].filter(l => LETTER_STROKES[l]); tr = letterTrace(pick(letters.length ? letters : ["L"])); }
  else tr = TRACES[key];
  const TOL = 26;
  let stroke = 0, prog = 0, dragging = false, done = false, pts = [];
  app.innerHTML = `${topBar(true)}
    <div class="prompt"><span>Trace ${tr.name} !</span>
      <button class="again" id="again" aria-label="Réécouter la consigne">🔊</button></div>
    <div class="stage">
      <div class="tracebox"><svg viewBox="0 0 400 260" id="tsvg" class="tsvg" role="img" aria-label="Route à tracer : ${tr.name}">
        <rect width="400" height="260" fill="#7cc96a"/>
        ${tr.strokes.map((d,i) => `<path d="${d}" class="troad${i ? " later" : ""}" data-s="${i}"/>`).join("")}
        ${tr.strokes.map((d,i) => `<path d="${d}" class="tline${i ? " later" : ""}" data-s="${i}"/>`).join("")}
        <path id="tdone" class="tdone" d=""/>
        <g id="tstart"></g>
        <g id="tcar"></g>
      </svg></div>
      <p class="parent">Pose ton doigt sur la voiture et fais-la rouler sur la route, sans sortir.</p>
    </div>`;
  wireTop();
  const svg = document.getElementById("tsvg");
  const line = `Pose ton doigt sur la voiture et trace ${tr.name}, sans sortir de la route !`;
  say(line);
  const T = track("trace", key === "lettre" ? "lettre " + tr.letter : tr.name);
  document.getElementById("again").onclick = () => say(line);
  const carG = favSvg().replace(/^\s*<svg[^>]*>/, "").replace(/<\/svg>\s*$/, "");
  const doneParts = [];
  function sample(i){
    const p = svg.querySelector(`.tline[data-s="${i}"]`), L = p.getTotalLength(), n = Math.max(2, Math.ceil(L / 4));
    pts = Array.from({length: n + 1}, (_,k) => { const q = p.getPointAtLength(L * k / n); return [q.x, q.y]; });
    prog = 0;
    svg.querySelectorAll(`[data-s="${i}"]`).forEach(e => e.classList.remove("later"));
    document.getElementById("tstart").innerHTML = `<circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="14" class="tdot"/><text x="${pts[0][0]}" y="${pts[0][1] + 5}" class="tnumtxt">${tr.strokes.length > 1 ? i + 1 : ""}</text><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="10" class="tend"/>`;
    drawCar();
  }
  function drawCar(){
    const a = pts[Math.min(prog, pts.length - 1)], b = pts[Math.min(prog + 2, pts.length - 1)], c = pts[Math.max(prog - 2, 0)];
    let ang = Math.atan2(b[1] - c[1], b[0] - c[0]) * 180 / Math.PI;
    const flip = Math.abs(ang) > 90;
    document.getElementById("tcar").innerHTML = `<g transform="translate(${a[0]},${a[1]}) rotate(${flip ? ang + 180 : ang}) scale(${flip ? -0.55 : 0.55},0.55) translate(-60,-44)">${carG}</g>`;
    const cur = "M" + pts.slice(0, prog + 1).map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
    document.getElementById("tdone").setAttribute("d", doneParts.join(" ") + " " + cur);
  }
  function toSvg(e){ const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) * 400 / r.width, (e.clientY - r.top) * 260 / r.height]; }
  const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
  let offWarned = false;
  svg.addEventListener("pointerdown", e => {
    if(done) return;
    const p = toSvg(e);
    if(dist(p, pts[prog]) > TOL * 1.9){ say("Pose ton doigt sur la voiture !"); return; }
    dragging = true; offWarned = false; svg.setPointerCapture(e.pointerId); e.preventDefault();
  });
  svg.addEventListener("pointermove", e => {
    if(!dragging || done) return;
    const p = toSvg(e);
    let best = -1, bd = 1e9;
    for(let k = prog; k < Math.min(pts.length, prog + 14); k++){ const d = dist(p, pts[k]); if(d < bd){ bd = d; best = k; } }
    if(bd <= TOL){ if(best > prog){ prog = best; drawCar(); if(Math.random() < .08) beep("tap"); } }
    else if(dist(p, pts[prog]) > TOL * 1.7 && !offWarned){
      offWarned = true; dragging = false; T.wrong(); beep("bad");
      svg.classList.remove("off"); void svg.getBoundingClientRect(); svg.classList.add("off");
      say("Oups, tu es sorti de la route ! Repose ton doigt sur la voiture.");
    }
    if(prog >= pts.length - 3) finishStroke();
  });
  const end = () => { dragging = false; };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function finishStroke(){
    dragging = false; prog = pts.length - 1; drawCar();
    doneParts.push("M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L"));
    stroke++;
    if(stroke < tr.strokes.length){ beep("good"); say("Bien ! Maintenant, le trait suivant."); sample(stroke); return; }
    done = true; beep("good"); T.right(null);
    svg.classList.add("win");
    const party = addStar();
    say(varyPraise(`Bravo ! Tu as tracé ${tr.name} !`));
    setTimeout(() => party ? celebrate(flow(traceGame)) : flow(traceGame)(), 2600);
  }
  sample(0);
}

    choices: order.map(i => ({label: kidName(opts[i][1]), html: `<span class="qart">${artHtml(opts[i][0])}</span><span class="clab">${esc(kidName(opts[i][1]))}</span>`})),

    onWrong: () => "Ce n'est pas ça. Repense à l'histoire.",

const FEM = {rouge:"rouge", bleu:"bleue", jaune:"jaune", vert:"verte", orange:"orange", violet:"violette"};
const ORD_TYPES = [["bus","le bus",() => BUS],["moto","la moto",() => VEH.moto.svg],["velo","le vélo",() => VEH.velo.svg],["pompiers","le camion de pompiers",() => VEH.pompiers.svg],["taxi","le taxi",() => specialSvg("taxi")]];
let ordStreak = 0;
function orderGame(){
  const g = gradeKey();
  const nItems = {PS:3, MS:4, GS:5, CP:6}[g];
  const steps = g === "PS" ? (ordStreak >= 3 ? 2 : 1) : g === "MS" ? 2 : g === "GS" ? (ordStreak >= 3 ? 3 : 2) : 3;
  const cars = shuffle(COLORS).map(c => ({id:"c" + c.id, label:`la voiture ${FEM[c.id]}`, html: car(c.hex)}));
  const types = shuffle(ORD_TYPES).map(t => ({id:t[0], label:t[1], html:t[2]()}));
  const pool = (g === "PS" || g === "MS") ? cars : shuffle([...cars.slice(0,3), ...types.slice(0,3)]);
  const items = pool.slice(0, nItems), seq = shuffle(items).slice(0, steps);
  const instr = "Touche " + seq.map(it => it.label).join(", puis ") + ".";
  app.innerHTML = `${topBar(true)}
    <div class="prompt"><span>Écoute bien la consigne !</span>
      <button class="again" id="again" aria-label="Réécouter la consigne">🔊</button></div>
    <div class="stage">
      <p class="enhint ordsteps">${steps} étape${steps > 1 ? "s" : ""} · ${Array.from({length: steps}, (_,i) => `<i id="os${i}"></i>`).join("")}</p>
      <div class="road ordlot">${items.map(it => `<button class="orditem" data-id="${it.id}" aria-label="${it.label}"><span class="num"></span>${it.html}</button>`).join("")}</div>
    </div>`;
  wireTop();
  say(instr);
  const T = track("consignes", `${steps} étape${steps > 1 ? "s" : ""}`);
  document.getElementById("again").onclick = () => say(instr);
  let k = 0, done = false;
  const reset = () => { k = 0; app.querySelectorAll(".orditem").forEach(b => { b.classList.remove("on"); b.querySelector(".num").textContent = ""; }); app.querySelectorAll(".ordsteps i").forEach(i => i.classList.remove("on")); };
  app.querySelectorAll(".orditem").forEach(b => b.onclick = () => {
    if(done || b.classList.contains("on")) return;
    if(b.dataset.id === seq[k].id){
      b.classList.add("on"); b.querySelector(".num").textContent = k + 1; document.getElementById("os" + k).classList.add("on"); beep("tap"); k++;
      if(k === seq.length){
        done = true; beep("good"); T.right(null);
        ordStreak++;
        const party = addStar();
        say(varyPraise(`Bravo ! Tu as tout fait dans l'ordre !`));
        setTimeout(() => party ? celebrate(flow(orderGame)) : flow(orderGame)(), 2400);
      }
    } else {
      T.wrong(); ordStreak = 0; beep("bad"); b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
      say(`Oups, ce n'était pas ça. Écoute encore : ${instr}`);
      reset();
      if(T.errors >= 2) hint(`.orditem[data-id="${seq[0].id}"]`);
    }
  });
}

function svgToPng(svgText, w, h){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.drawImage(img, 0, 0, w, h); c.toBlob(b => b ? res(b) : rej(new Error("png")), "image/png"); };
    img.onerror = rej;
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText);
  });
}

const ROUND_LEN = 5;
function seededRand(seed){
  let h = 2166136261;
  for(const c of seed){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
}
function homeGames(){
  const av = availableGames();
  if(av.length <= 6) return av;
  const r = seededRand(today() + (curProfile() ? curProfile().id : ""));
  const jit = {}; av.forEach(k => jit[k] = r());
  const weak = av.filter(k => k !== "histoires").sort((a,b) => (skillScore(a) - skillScore(b)) || (jit[a] - jit[b])).slice(0,3);
  const rest = av.filter(k => !weak.includes(k)).sort((a,b) => jit[a] - jit[b]);
  const pick = new Set([...weak, ...rest.slice(0,3)]);
  return av.filter(k => pick.has(k));
}

const euros = n => n === 1 ? "un euro" : `${numWord(n)} euros`;
function fuelGame(){

  if(g === "CP" && Math.random() < .5) return changeGame();
  const coins = {PS:[1], MS:[1,2], GS:[1,2,5], CP:[1,2,5,10]}[g];
  const price = {PS:1 + rnd(3), MS:2 + rnd(5), GS:3 + rnd(8), CP:5 + rnd(16)}[g];
  app.innerHTML = `${topBar(true)}

    <div class="stage">
      <div class="pumprow"><div class="pump" data-price="${price}"><small>Le plein</small><b>${price} €</b></div><span class="pumpcar">${favSvg()}</span></div>
      <div class="tray" id="tray" aria-live="polite"><span class="trayhint">Mets les pièces ici</span></div>

  const line = g === "PS" ? `Le plein coûte ${euros(price)}. Donne ${price === 1 ? "une pièce" : numWord(price) + " pièces"} de un euro.` : `Le plein coûte ${euros(price)}. Donne les pièces, puis appuie sur Payer.`;
  say(line);
  const T = track("monnaie", `${price} €`);
  document.getElementById("again").onclick = () => say(line);
  let given = [], done = false;
  const tray = document.getElementById("tray");
  const draw = () => {
    tray.innerHTML = given.length ? given.map((v,i) => `<button class="tcoin c${v}" data-j="${i}" aria-label="Reprendre ${euros(v)}">${MONEY[v]}</button>`).join("") : `<span class="trayhint">Mets les pièces ici</span>`;
    tray.querySelectorAll(".tcoin").forEach(b => b.onclick = () => { if(done) return; given.splice(+b.dataset.j, 1); draw(); });
  };
  app.querySelectorAll(".coin").forEach(b => b.onclick = () => { if(done || given.length >= 14) return; given.push(+b.dataset.v); beep("tap"); draw(); say(euros(+b.dataset.v)); });
  document.getElementById("tclear").onclick = () => { if(!done){ given = []; draw(); } };
  document.getElementById("pay").onclick = () => {
    if(done) return;
    const sum = given.reduce((a,b) => a + b, 0);
    if(!given.length){ say("Mets d'abord des pièces."); return; }
    if(sum === price){
      done = true; beep("good"); T.right(null);
      const party = addStar();
      say(varyPraise(`Bravo ! Tu as donné ${euros(sum)}, c'est juste le bon prix !`));
      setTimeout(() => party ? celebrate(flow(fuelGame)) : flow(fuelGame)(), 3000);
    } else {
      T.wrong(); beep("bad");
      say(sum < price ? `Il manque des sous. Tu as donné ${euros(sum)}, le plein coûte ${euros(price)}.` : `C'est trop ! Tu as donné ${euros(sum)}, le plein coûte ${euros(price)}. Reprends des pièces.`);
    }
  };
}
function changeGame(){
  const price = 3 + rnd(15), paid = price <= 10 ? 10 : 20, back = paid - price;
  const opts = new Set([back]); while(opts.size < 3){ const d = back + pick([-3,-2,-1,1,2,3]); if(d >= 0) opts.add(d); }
  const keys = shuffle([...opts]);
  choiceRound({
    title: "Combien te rend-on ?",
    line: `Le plein coûte ${euros(price)}. Tu donnes ${euros(paid)}. Combien d'euros doit-on te rendre ?`,
    scene: `<div class="pumprow"><div class="pump"><small>Le plein</small><b>${price} €</b></div><span class="paid">Tu donnes<br>${MONEY[paid]}</span></div>`,
    choices: keys.map(v => ({label: euros(v), html: `<b>${v} €</b>`})),
    isRight: i => keys[i] === back,
    onRight: () => `Oui ! ${paid} moins ${price}, ça fait ${back}. On te rend ${euros(back)}.`,
    onWrong: () => `Compte à partir de ${price} jusqu'à ${paid}.`,
    game: "monnaie", item: `rendre sur ${paid} €`, next: fuelGame, wait: 3200
  });
}

// ---------- 6. le klaxon musical ----------
function rhythmPattern(g){
  if(g === "PS") return [1 + rnd(3)];
  const grp = () => 1 + rnd(3), n = g === "MS" ? 2 : g === "GS" ? 3 : 3 + rnd(2);
  let p; do { p = Array.from({length:n}, grp); } while(p.every(x => x === p[0]) && g !== "MS");
  return p;
}
function rhythmGame(){
  const g = gradeKey(), pat = rhythmPattern(g), showDots = g === "PS" || g === "MS";
  app.innerHTML = `${topBar(true)}
    <div class="prompt"><span>Écoute, puis refais le même rythme !</span>
      <button class="again" id="again" aria-label="Réécouter le rythme">🔊</button></div>
    <div class="stage">
      <div class="rpattern${showDots ? "" : " hidden2"}" id="rpat" data-pattern="${pat.join(",")}">${pat.map((n,gi) => `<span class="rgroup">${Array.from({length:n}, (_,k) => `<i data-g="${gi}" data-k="${k}"></i>`).join("")}</span>`).join("")}</div>
      <div class="rmine" id="rmine"></div>
      ${soundOn ? "" : '<p class="mute-note">Allume le son pour jouer à ce jeu.</p>'}
      <div class="listen-wrap"><button class="listen" id="khorn" aria-label="Klaxon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 20 h8 l20 -12 v32 l-20 -12 h-8z" fill="#ffffff" stroke="#1f2a44" stroke-width="3" stroke-linejoin="round"/><path d="M38 18 q4 6 0 12" fill="none" stroke="#1f2a44" stroke-width="3.5" stroke-linecap="round"/></svg><span>Tut !</span></button></div>
    </div>`;
  wireTop();
  const T = track("rythme", pat.join("-"));
  let taps = [], busy = false, done = false, timer = null, gen = 0;
  const horn = document.getElementById("khorn"), mine = document.getElementById("rmine");
  const honk = (t) => { try{ const c = ac(); const lp = lowpass(c, 1800); osc(c,"square",392,t,.16,.12,lp); osc(c,"square",494,t,.16,.09,lp); }catch(e){} };
  function play(){
    if(done) return;
    busy = true; taps = []; mine.innerHTML = ""; const my = ++gen;
    let t = 0;
    const dots = [...document.querySelectorAll("#rpat i")];
    document.getElementById("rpat").classList.add("playing");
    try{
      const c = ac(), t0 = c.currentTime + .1;
      pat.forEach((n, gi) => { for(let k = 0; k < n; k++){ honk(t0 + t); const at = t; later(() => { const d = dots.find(x => +x.dataset.g === gi && +x.dataset.k === k); if(d){ d.classList.add("on"); setTimeout(() => d.classList.remove("on"), 220); } }, (at + .1) * 1000); t += .32; } t += .55; });
    }catch(e){}
    later(() => { if(my !== gen) return; busy = false; document.getElementById("rpat") && document.getElementById("rpat").classList.remove("playing"); say("À toi !"); }, (t + .2) * 1000);
  }
  function check(){
    if(done || !taps.length) return;
    const groups = []; let cur = 1;
    for(let i = 1; i < taps.length; i++){ if(taps[i] - taps[i-1] > 480){ groups.push(cur); cur = 1; } else cur++; }
    groups.push(cur);
    if(groups.join() === pat.join()){
      done = true; beep("good"); T.right(null);
      const party = addStar();
      say(varyPraise("Bravo ! C'est exactement le même rythme !"));
      setTimeout(() => party ? celebrate(flow(rhythmGame)) : flow(rhythmGame)(), 2600);
    } else {
      T.wrong(); beep("bad"); taps = [];
      say(`Pas tout à fait. Il fallait ${pat.map(n => numWord(n)).join(", puis ")}. Écoute encore.`, () => later(play, 300));
    }
  }
  horn.onclick = () => {
    if(done || busy) return;
    taps.push(performance.now());
    try{ honk(ac().currentTime + .01); }catch(e){}
    mine.insertAdjacentHTML("beforeend", "<i></i>");
    clearTimeout(timer); timer = setTimeout(check, 1300); lightTimers.push(timer);
  };
  document.getElementById("again").onclick = () => { if(!busy) play(); };
  say("Écoute bien le klaxon.", () => later(play, 200));
}
