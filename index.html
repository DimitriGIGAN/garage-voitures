// ---------- 1. le labyrinthe ----------
function makeMaze(n){
  const W = Array.from({length:n*n}, () => 15), seen = new Set([0]), stack = [0];
  const D = [[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]];
  while(stack.length){
    const c = stack[stack.length-1], x = c % n, y = Math.floor(c / n);
    const nb = shuffle(D).map(([dx,dy,b,ob]) => [x+dx, y+dy, b, ob]).filter(([a,b2]) => a >= 0 && b2 >= 0 && a < n && b2 < n && !seen.has(b2*n+a));
    if(!nb.length){ stack.pop(); continue; }
    const [a, b2, bit, obit] = nb[0], k = b2*n + a;
    W[c] &= ~bit; W[k] &= ~obit; seen.add(k); stack.push(k);
  }
  return W;
}
function mazeGame(){
  const g = gradeKey(), n = {PS:3, MS:4, GS:5, CP:6}[g];
  const W = makeMaze(n), goal = n*n - 1;
  let pos = 0, done = false, bumps = 0;
  app.innerHTML = `${topBar(true)}
    <div class="prompt"><span>Conduis jusqu'au garage !</span>
      <button class="again" id="again" aria-label="Réécouter la consigne">🔊</button></div>
    <div class="stage">
      <div class="maze" id="maze" style="--n:${n}">${W.map((w,i) => `<button class="mz" data-i="${i}" data-w="${w}" aria-label="Case ${i+1}" style="border-top-width:${w&1?3:0}px;border-right-width:${w&2?3:0}px;border-bottom-width:${w&4?3:0}px;border-left-width:${w&8?3:0}px">${i === goal ? `<span class="mzgoal">${GARAGE_MINI}</span>` : ""}</button>`).join("")}</div>
      <p class="pnote mzhelp">Glisse ton doigt, ou touche la case d'à côté.</p>
    </div>`;
  wireTop();
  const line = "Conduis ta voiture jusqu'au garage. Attention aux murs !";
  say(line);
  const T = track("labyrinthe", `${n} × ${n}`);
  document.getElementById("again").onclick = () => say(line);
  const maze = document.getElementById("maze"), cells = [...maze.querySelectorAll(".mz")];
  const carEl = document.createElement("span"); carEl.className = "mzcar"; carEl.innerHTML = favSvg();
  const place = () => { cells[pos].appendChild(carEl); cells.forEach(c => c.classList.remove("trail-now")); cells[pos].classList.add("trail", "trail-now"); };
  place();
  function canGo(a, b){
    const ax = a % n, ay = Math.floor(a / n), bx = b % n, by = Math.floor(b / n);
    if(Math.abs(ax-bx) + Math.abs(ay-by) !== 1) return false;
    const bit = by < ay ? 1 : bx > ax ? 2 : by > ay ? 4 : 8;
    return !(W[a] & bit);
  }
  function tryMove(i, quiet){
    if(done || i === pos) return;
    if(!canGo(pos, i)){
      if(quiet) return;
      bumps++; if(bumps === 3) T.wrong(); beep("bad");
      cells[i].classList.remove("no"); void cells[i].offsetWidth; cells[i].classList.add("no");
      if(bumps === 1) say("Oups, un mur ! Passe par la route.");
      return;
    }
    pos = i; place(); beep("tap");
    if(pos === goal){
      done = true; T.right(null); maze.classList.add("win");
      const party = addStar();
      say(varyPraise("Bravo ! Tu es arrivé au garage !"));
      setTimeout(() => party ? celebrate(flow(mazeGame)) : flow(mazeGame)(), 2400);
    }
  }
  cells.forEach(c => c.onclick = () => tryMove(+c.dataset.i));
  let dragging = false;
  maze.addEventListener("pointerdown", e => { const c = e.target.closest(".mz"); if(c && +c.dataset.i === pos){ dragging = true; maze.setPointerCapture && maze.setPointerCapture(e.pointerId); } });
  maze.addEventListener("pointermove", e => { if(!dragging) return; const el = document.elementFromPoint(e.clientX, e.clientY); const c = el && el.closest && el.closest(".mz"); if(c) tryMove(+c.dataset.i, true); });
  const stop = () => { dragging = false; };
  maze.addEventListener("pointerup", stop); maze.addEventListener("pointercancel", stop);
}

function balanceSvg(L, R, tilt){

// ---------- 6. la grande course ----------
const RACERS = [{n:"rouge", hex:"#e63946"}, {n:"bleue", hex:"#2f6fe4"}, {n:"jaune", hex:"#ffc93c"}, {n:"verte", hex:"#2fb36b"}, {n:"violette", hex:"#8e5ae8"}];
const ORD = ["première","deuxième","troisième","quatrième","cinquième"];
let raceStep = 0, raceRival = 0;
function raceTrack(cars){
  return `<div class="rtrack">${cars.map(c => `<div class="lane"><span class="rcar" style="left:${c.x}%">${car(c.hex)}</span></div>`).join("")}<div class="finish"></div></div>`;
}
function raceGame(){
  const g = gradeKey();
  if(g === "CP" && Math.random() < .5) return raceCalc();
  const n = {PS:3, MS:3, GS:4, CP:5}[g];
  const cars = shuffle(RACERS).slice(0, n), ranks = shuffle([...Array(n).keys()]);
  cars.forEach((c, i) => { c.rank = ranks[i]; c.x = 70 - ranks[i] * (62 / n) - Math.random() * 4; });
  const byRank = cars.slice().sort((a,b) => a.rank - b.rank);
  let q, target;
  const r = g === "PS" ? 0 : g === "MS" ? pick([0, n - 1, 1]) : rnd(n);
  if((g === "GS" || g === "CP") && Math.random() < .4){
    const ref = byRank[1 + rnd(n - 1)]; target = byRank[ref.rank - 1];
    q = `Quelle voiture est juste devant la voiture ${ref.n} ?`;
  } else if(r === n - 1 && g !== "PS"){ target = byRank[r]; q = "Quelle voiture est la dernière ?"; }
  else { target = byRank[r]; q = `Quelle voiture est ${ORD[r]} ?`; }
  const opts = shuffle(cars).slice(0, Math.min(n, 4)); if(!opts.includes(target)) opts[0] = target;
  const keys = shuffle(opts);
  choiceRound({
    title: q, line: `La course ! Les voitures roulent vers le drapeau. ${q}`,
    scene: raceTrack(cars),
    choices: keys.map(c => ({label: "La voiture " + c.n, html: `<span class="rpick">${car(c.hex)}</span>`})),
    isRight: i => keys[i] === target,
    onRight: () => `Oui ! C'est la voiture ${target.n}.`,
    onWrong: () => "Regarde le drapeau à damier : la première, c'est celle qui en est le plus près.",
    game: "course", item: q.replace(/\?$/, ""), next: raceGame, wait: 2400
  });
}
function raceCalc(){
  const add = Math.random() < .6, a = add ? 2 + rnd(10) : 8 + rnd(12), b = add ? 1 + rnd(Math.min(9, 20 - a)) : 1 + rnd(Math.min(9, a - 1));
  const res = add ? a + b : a - b;
  const s = new Set([res]); while(s.size < 3){ const d = res + pick([-2,-1,1,2,10]); if(d >= 0 && d <= 30) s.add(d); }
  const keys = shuffle([...s]);
  const me = {hex: "#2f6fe4", x: 8 + raceStep * 21}, rv = {hex: "#e63946", x: 8 + raceRival * 21};
  choiceRound({
    title: `${a} ${add ? "+" : "−"} ${b} = ?`,
    line: `Course de calcul ! Combien font ${a} ${add ? "plus" : "moins"} ${b} ? Chaque bonne réponse fait avancer ta voiture bleue.`,
    scene: raceTrack([me, rv]),
    choices: keys.map(v => ({label: String(v), html: `<b>${v}</b>`})),
    isRight: i => keys[i] === res,
    onRight: () => { raceStep++; if(raceStep >= 3){ raceStep = 0; raceRival = 0; return `Oui, ${res} ! Ta voiture a franchi la ligne d'arrivée : tu as gagné la course !`; } return `Oui, ${res} ! Ta voiture avance.`; },
    onWrong: () => { if(raceRival < 2) raceRival++; return `Non. Compte avec tes doigts : ${a} ${add ? "plus" : "moins"} ${b}.`; },
    game: "course", item: add ? "addition" : "soustraction", next: raceGame, wait: 2800
  });
}

function newMoonJD(k){

    + 0.00739 * E * Math.sin(Mp - M) - 0.00514 * E * Math.sin(Mp + M) + 0.00208 * E * E * Math.sin(2*M)

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micOK = !!SR;
const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
const NUMW = {zero:0,un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,onze:11,douze:12,treize:13,quatorze:14,quinze:15,seize:16,"dix sept":17,"dix huit":18,"dix neuf":19,vingt:20};
function matchSpoken(heard, labels){
  const h = norm(heard), hn = (h.match(/\d+/) || [])[0] || Object.entries(NUMW).filter(([w]) => (" " + h + " ").includes(" " + w + " ")).sort((a,b) => b[0].length - a[0].length).map(x => String(x[1]))[0];
  let best = -1, score = 0;
  labels.forEach((l, i) => {
    const L = norm(l); if(!L) return;
    if(hn != null && L === String(hn)) { best = i; score = 99; return; }
    const words = L.split(" ").filter(w => w.length > 2 && !["les","des","une","voiture","vroumi","dans","pour"].includes(w));
    const s = words.filter(w => h.includes(w)).length;
    if(s > score){ score = s; best = i; }
  });
  return score > 0 ? best : -1;
}

function wireMic(labels, onPick){
  const b = document.getElementById("mic"); if(!b) return;
  b.onclick = () => {
    let rec; try{ rec = new SR(); }catch(e){ micOK = false; b.remove(); return; }
    rec.lang = "fr-FR"; rec.interimResults = false; rec.maxAlternatives = 3;
    try{ speechSynthesis.cancel(); }catch(e){}
    b.classList.add("listening");

      const alts = [...ev.results[0]].map(a => a.transcript);
      for(const a of alts){ const i = matchSpoken(a, labels); if(i >= 0){ onPick(i); return; } }
      say(`J'ai entendu « ${alts[0]} ». Redis-le, ou touche la réponse.`);

    rec.onerror = ev => { b.classList.remove("listening"); if(ev.error === "not-allowed" || ev.error === "service-not-allowed" || ev.error === "audio-capture"){ micOK = false; b.remove(); say("Le micro n'est pas disponible ici. Touche la réponse avec ton doigt."); } };

function dominantColor(img){
  const c = document.createElement("canvas"), S = 120; c.width = S; c.height = S;
  const x = c.getContext("2d"), r = Math.min(img.width, img.height) * .5;
  x.drawImage(img, (img.width - r) / 2, (img.height - r) / 2, r, r, 0, 0, S, S);
  const d = x.getImageData(0, 0, S, S).data, votes = {};
  for(let i = 0; i < d.length; i += 4){
    const R = d[i]/255, G = d[i+1]/255, B = d[i+2]/255, mx = Math.max(R,G,B), mn = Math.min(R,G,B), l = (mx + mn) / 2, dl = mx - mn;
    if(dl < .18 || l < .12 || l > .92) continue;
    let h = mx === R ? 60 * (((G - B) / dl) % 6) : mx === G ? 60 * ((B - R) / dl + 2) : 60 * ((R - G) / dl + 4); if(h < 0) h += 360;
    const best = PHOTO_COLORS.map(p => ({p, dd: Math.min(Math.abs(h - p.h), 360 - Math.abs(h - p.h))})).sort((a,b) => a.dd - b.dd)[0].p;
    const k = (best.id === "rouge" && h > 300 && h < 345) ? "violet" : best.id;
    votes[k] = (votes[k] || 0) + dl;
  }
  const top = Object.entries(votes).sort((a,b) => b[1] - a[1])[0];
  return top && top[1] > 40 ? top[0] : null;
}

function carnetSvg(){
  const d = new Date(), month = MOIS[d.getMonth()] + " " + d.getFullYear(), pre = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  const rows = SKILLS.map(sk => { const g = stats[sk.id]; let r = 0, f = 0; Object.entries((g && g.days) || {}).forEach(([k, v]) => { if(k.startsWith(pre)){ r += v[0]; f += v[1]; } }); return {sk, r, p: r ? f / r : 0}; }).filter(x => x.r >= 3).sort((a,b) => b.r - a.r).slice(0, 8);
  const permits = SKILLS.filter(sk => pdata.permits && pdata.permits[sk.id]).map(sk => sk.label);
  const X = s => esc(s), W = 1240;
  let y = 560;
  const bars = rows.map(x => { const out = `<text x="110" y="${y}" font-size="34" font-weight="700" fill="#1f2a44">${X(x.sk.label)}</text><rect x="620" y="${y - 30}" width="480" height="36" rx="18" fill="#e5e9f2"/><rect x="620" y="${y - 30}" width="${Math.max(36, 480 * x.p)}" height="36" rx="18" fill="${x.p >= .8 ? "#2fb36b" : x.p >= .5 ? "#ffc93c" : "#ff7a2f"}"/><text x="1120" y="${y}" font-size="30" font-weight="700" fill="#1f2a44" text-anchor="end"></text>`; y += 70; return out; }).join("");
  const py = y + 50;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} 1754" width="${W}" height="1754" font-family="Nunito, Arial, sans-serif">
  <rect width="${W}" height="1754" fill="#ffffff"/><rect x="40" y="40" width="${W - 80}" height="1674" rx="50" fill="#e9f7ff" stroke="#1f2a44" stroke-width="8"/>
  <text x="${W/2}" y="170" font-size="72" font-weight="800" text-anchor="middle" fill="#1f2a44">Carnet de route</text>
  <text x="${W/2}" y="250" font-size="44" font-weight="700" text-anchor="middle" fill="#ff7a2f">${X(curProfile().name)} · ${X(month)}</text>
  <svg x="${W/2 - 150}" y="270" width="300" height="160" viewBox="0 -14 140 80">${inner120(vroumiSvg())}</svg>
  <text x="${W/2}" y="470" font-size="36" font-weight="700" text-anchor="middle" fill="#1f2a44">${pdata.earned || 0} étoiles · ${pdata.medals || 0} médaille${(pdata.medals || 0) > 1 ? "s" : ""} · ${permits.length} permis · ${VSTAGES[vStage()].name}</text>
  ${rows.length ? bars : `<text x="${W/2}" y="600" font-size="34" text-anchor="middle" fill="#5a6a8a">Pas encore assez de parties ce mois-ci.</text>`}
  <text x="110" y="${py}" font-size="40" font-weight="800" fill="#1f2a44">Mes permis de conduire</text>
  ${permits.length ? permits.slice(0, 12).map((p, i) => `<text x="${i % 2 ? 660 : 130}" y="${py + 70 + Math.floor(i / 2) * 56}" font-size="32" fill="#1f2a44">★ ${X(p)}</text>`).join("") : `<text x="130" y="${py + 70}" font-size="32" fill="#5a6a8a">Le premier arrive bientôt !</text>`}
  <text x="${W/2}" y="1640" font-size="40" font-weight="800" text-anchor="middle" fill="#2fb36b">Bravo ${X(curProfile().name)}, continue comme ça !</text>
</svg>`;
}
async function saveCarnet(b){
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;

}

const PCOLORS = ["#2f6fe4","#e63946","#2fb36b","#ff7a2f","#8e5ae8","#ffc93c"];
let profiles = {list:[], current:null};
try{ profiles = JSON.parse(lsGet("gv_profiles") || "null") || profiles; }catch(e){}
if(!profiles.list) profiles = {list:[], current:null};
if(!profiles.list.length && (lsGet("gv_stars") || lsGet("gv_name"))){
  // first run: move the results already on this device into a first profile
  const id = "p" + Date.now().toString(36);
  let oldStats = {}, oldBy = {};
  try{ oldStats = JSON.parse(lsGet("gv_stats") || "{}") || {}; }catch(e){}
  try{ oldBy = JSON.parse(lsGet("gv_starsby") || "{}") || {}; }catch(e){}
  profiles = {list:[{id, name: lsGet("gv_name") || "Mon enfant", color:"#2f6fe4"}], current:id};
  lsSet("gv_p_" + id, JSON.stringify({stars: +lsGet("gv_stars") || 0, starsBy: oldBy, stats: oldStats}));
  saveProfiles();
}
function saveProfiles(){ lsSet("gv_profiles", JSON.stringify(profiles)); }
function deleteProfile(id){
  profiles.list = profiles.list.filter(p => p.id !== id);
  try{ localStorage.removeItem("gv_p_" + id); }catch(e){}
  if(profiles.current === id) profiles.current = profiles.list.length ? profiles.list[0].id : null;
  saveProfiles();
  if(!profiles.list.length){ whoPlays(); return; }
  loadProfile(profiles.current);
  classView();
}
function curProfile(){ return profiles.list.find(p => p.id === profiles.current) || profiles.list[0]; }
function profileData(id){ try{ return JSON.parse(lsGet("gv_p_" + id) || "{}") || {}; }catch(e){ return {}; } }
function saveProfileData(){ const p = curProfile(); if(p) lsSet("gv_p_" + p.id, JSON.stringify(Object.assign({stars, starsBy, stats}, pdata))); }
const GRADES = {
  PS:{label:"Petite section",  count:3,  countMax:6,  shape:3, size:3, sound:3},
  MS:{label:"Moyenne section", count:6,  countMax:10, shape:4, size:4, sound:4},
  GS:{label:"Grande section",  count:10, countMax:10, shape:5, size:5, sound:5},
  CP:{label:"CP",              count:10, countMax:10, shape:5, size:5, sound:5}
};
function baseGradeKey(){ const p = curProfile(); return (p && GRADES[p.grade]) ? p.grade : "MS"; }
const GORDER = ["PS","MS","GS","CP"];
const NO_ADAPT = ["compter","formes","taille","sons","suites","espace","histoires","peinture","prenom","couleurs"];
function effGrade(game){
  const b = baseGradeKey();
  if(!game || NO_ADAPT.includes(game) || !GAMES[game] || typeof pdata === "undefined" || !pdata || !pdata.boost) return b;
  let i = Math.max(0, Math.min(3, GORDER.indexOf(b) + (pdata.boost[game] || 0)));
  const ok = GAMES[game].grades;
  while(ok && !ok.includes(GORDER[i]) && i < 3) i++;
  return GORDER[i];
}
function gradeKey(){ return effGrade(curGame); }
function grade(){ return GRADES[gradeKey()]; }
function gradeSelect(id, val){
  return `<select id="${id}" class="gsel">${Object.entries(GRADES).map(([k,g]) => `<option value="${k}"${k===val?" selected":""}>${g.label}</option>`).join("")}</select>`;
}
function loadProfile(id){
  profiles.current = id; saveProfiles();
  const d = profileData(id);
  stars = d.stars || 0; starsBy = d.starsBy || {}; stats = d.stats || {};
  pdata = fixPdata(d); if(pdata.earned < stars) pdata.earned = stars;
  session = null;
  try{ pruneOld(); const up = checkRentree(curProfile()); if(up){ pendingCard = {pic: favSvg(), title: "Bonne rentrée !", text: `${esc(curProfile().name)} passe en ${GRADES[up].label.toLowerCase()} ! Les jeux s'adaptent à sa nouvelle classe.`, say: `Bonne rentrée ${curProfile().name} ! Tu passes en ${GRADES[up].label.toLowerCase()} !`}; window.setTimeout(() => { if(app.querySelector(".daychip") && !document.querySelector(".party")) celebrate(() => {}); }, 1500); } }catch(e){}
  childName = curProfile().name;
  const G = grade();
  level = G.count; streak = 0; shapeLevel = G.shape; shapeStreak = 0; sizeN = G.size; sizeStreak = 0; soundLevel = G.sound; soundStreak = 0;
  trainLvl = TRAIN_START[gradeKey()]; trainStreak = 0; gpsStreak = 0;
}
function whoPlays(){
  navSeq++;
  curGame = null; stopLights();
  const used = profiles.list.map(p => p.color);
  let sel = PCOLORS.find(c => !used.includes(c)) || PCOLORS[0];
  const empty = !profiles.list.length;
  app.innerHTML = `
    <h1>${empty ? "Bienvenue au garage !" : "Qui joue ?"}</h1>
    <p class="sub">${empty ? "Pour commencer, écrivez le prénom de votre enfant." : "Touche ton prénom"}</p>
    <div class="menu">
      ${profiles.list.map(p => `<button class="mode whob" data-id="${p.id}">
        <span class="pic"><span style="width:110px">${car(p.color)}</span></span>
        ${esc(p.name)}
        <small>${(GRADES[p.grade] || GRADES.MS).label} · ${STAR.replace('aria-hidden="true"','aria-hidden="true" class="inl"')} ${profileData(p.id).stars || 0} étoiles</small>
      </button>`).join("")}
    </div>
    <form id="addp" class="addp">
      <label for="newname">${empty ? "Prénom de l'enfant" : "Ajouter un enfant"}</label>
      <div class="addrow">
        <input id="newname" maxlength="12" placeholder="Son prénom" autocomplete="off">
        <button type="submit" class="iconbtn">Ajouter</button>
      </div>
      <div class="addrow"><label for="newgrade" class="glab">Sa classe</label>${gradeSelect("newgrade", "MS")}</div>
      ${a11yFields("a11yn", {})}
      <div class="colors" role="group" aria-label="Couleur de sa voiture">
        ${PCOLORS.map((c,i) => `<button type="button" class="cdot" data-c="${c}" aria-label="Couleur ${i+1}" aria-pressed="${c===sel}" style="background:${c}"></button>`).join("")}
      </div>
      <p id="addmsg" class="pnote" hidden>Écrivez un prénom avec au moins une lettre.</p>
    </form>
    <p class="parent">Les profils et les résultats sont enregistrés dans ce navigateur, sur cet appareil.</p>`;
  app.querySelectorAll(".whob").forEach(b => b.onclick = () => { beep("honk"); loadProfile(b.dataset.id); say(`Bonjour ${curProfile().name} !`); menu(); });
  app.querySelectorAll(".cdot").forEach(b => b.onclick = () => {
    sel = b.dataset.c; app.querySelectorAll(".cdot").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  wireA11yFields(document.getElementById("addp"), "a11yn");
  document.getElementById("addp").addEventListener("submit", e => {
    e.preventDefault();
    const v = document.getElementById("newname").value.trim().slice(0,12);
    if(!cleanName(v)){ document.getElementById("addmsg").hidden = false; return; }
    const id = "p" + Date.now().toString(36);
    profiles.list.push({id, name:v, color:sel, grade:document.getElementById("newgrade").value, gradeYear:schoolYear(), a11y:readA11y(document.getElementById("addp"), "a11yn")}); saveProfiles();
    lsSet("gv_p_" + id, JSON.stringify({stars:0, starsBy:{}, stats:{}}));
    if(profiles.list.length === 1){ loadProfile(id); menu(); } else whoPlays();
  });
}

if(profiles.list.length) loadProfile(curProfile().id);
if(profiles.list.length === 1) menu(); else whoPlays();
})();
</script>
